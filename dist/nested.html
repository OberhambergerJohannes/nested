  clue(px) { px.rect(3, 3, 10, 11, '#f6eed8'); px.hline(4, 11, 6, '#b0a080'); px.hline(4, 9, 8, '#b0a080'); px.hline(4, 10, 10, '#b0a080'); px.disc(11, 11, 2.5, '#5aa048'); px.set(11, 11, '#ffffff'); },
  sparkle(px) { px.line(8, 1, 8, 15, '#fff4b0'); px.line(1, 8, 15, 8, '#fff4b0'); px.disc(8, 8, 2, '#ffffff'); },
  no(px) { UI_ICON.cross(px); },
};

function genIcon(kind, key) {
  const px = icoNew();
  const fn = kind === 'mat' ? MAT_ICON[key] : kind === 'item' ? ITEM_ICON[key] : UI_ICON[key];
  if (!fn) { px.rect(4, 4, 8, 8, '#ff00ff'); return icoDone(px); }
  fn(px);
  return icoDone(px);
}

// ---- js/art/sprites.js ----
// Sprite registry: generates art on demand and caches canvases.
// A sprite is { img: HTMLCanvasElement, ax, ay, w, h } where (ax, ay) is the anchor.

const SPR = {
  cache: new Map(),
  font: null,
  tiles: null,

  init() {
    this.font = new PixelFont();
    this.tiles = new TileArt();
  },

  _get(key, make) {
    let s = this.cache.get(key);
    if (!s) {
      const r = make();
      s = { img: r.px.canvas(), ax: r.ax, ay: r.ay, w: r.px.w, h: r.px.h, px: r.px };
      if (r.lights) s.lights = r.lights;
      if (r.eaves) s.eaves = r.eaves;
      if (r.chimneys) s.chimneys = r.chimneys;
      this.cache.set(key, s);
    }
    return s;
  },

  tree(kind, st, season, fruit) { return this._get('t:' + kind + st + season + (fruit ? 1 : 0), () => genTree(kind, st, season, fruit)); },
  shrub(kind, st, season, fruit) { return this._get('s:' + kind + st + season + (fruit ? 1 : 0), () => genShrub(kind, st, season, fruit)); },
  plant(kind, st, season, v) { return this._get('p:' + kind + st + season + ':' + (kind === 'herbs' ? v % 3 : 0), () => genPlant(kind, st, season, v)); },
  building(kind, season, lit) { return this._get('b:' + kind + season + (lit ? 1 : 0), () => genBuilding(kind, season, lit)); },
  mailbox(flag) { return this._get('mb:' + (flag ? 1 : 0), () => genMailbox(flag)); },
  struct(kind, season) { return this._get('st:' + kind + season, () => genStruct(kind, season)); },
  rock(kind, level, season) { return this._get('r:' + kind + level + season, () => genRock(kind, level, season)); },
  log(moss, season) { return this._get('lg:' + moss + season, () => genLog(moss, season)); },
  stump(moss, season) { return this._get('sp:' + moss + season, () => genStump(moss, season)); },
  forage(kind, season) { return this._get('f:' + kind + season, () => genForage(kind, season)); },
  web() { return this._get('web', genWeb); },
  landmark(kind, season) { return this._get('lm:' + kind + season, () => genLandmark(kind, season)); },
  qitem(kind) { return this._get('qi:' + kind, () => genQItem(kind)); },
  puddle() { return this._get('puddle', genPuddle); },
  nest(type) { return this._get('n:' + type, () => genNest(type)); },
  egg(spId) { const sp = SPECIES_BY_ID[spId]; return this._get('egg:' + spId, () => { const px = buildEgg(sp.egg, sp.big); return { px, ax: px.w >> 1, ay: px.h - 1 }; }); },
  chick(kind) { return this._get('ch:' + kind, () => { const px = buildChick(kind); return { px, ax: px.w >> 1, ay: px.h - 1 }; }); },
  icon(kind, key) { return this._get('i:' + kind + ':' + key, () => ({ px: genIcon(kind, key), ax: 8, ay: 8 })); },
  matIcon(k) { return this.icon('mat', k); },
  itemIcon(k) { return this.icon('item', k); },
  ui(k) { return this.icon('ui', k); },

  fence(season) {
    const key = 'fence' + season;
    let s = this.cache.get(key);
    if (!s) {
      const f = genFenceParts(season);
      s = { post: f.post.canvas(), railH: f.railH.canvas(), railV: f.railV.canvas() };
      this.cache.set(key, s);
    }
    return s;
  },

  bird(spId) {
    const key = 'bird:' + spId;
    let s = this.cache.get(key);
    if (!s) {
      const b = buildBirdSprites(SPECIES_BY_ID[spId]);
      s = { w: b.w, h: b.h, ax: b.ax, ay: b.ay, fw: b.fw, fh: b.fh, px: b };
      for (const k of ['perch', 'peck', 'fly1', 'fly2', 'hop']) { s[k] = b[k].canvas(); s[k + '_L'] = b[k + '_L'].canvas(); }
      this.cache.set(key, s);
    }
    return s;
  },

  // Dark silhouette of a bird (for species not yet discovered)
  birdSil(spId) {
    const key = 'bsil:' + spId;
    let c = this.cache.get(key);
    if (!c) {
      const q = this.bird(spId).px.perch.clone();
      const v = C('#4a4458');
      for (let i = 0; i < q.p.length; i++) if (q.p[i] >>> 24) q.p[i] = v;
      c = q.canvas();
      this.cache.set(key, c);
    }
    return c;
  },

  // Characters: opts from NPC_LOOKS or playerLookOpts(look); opts may be a function (called on a miss)
  person(id, opts, dir, frame) {
    const key = 'pp:' + id + ':' + dir + ':' + frame;
    let s = this.cache.get(key);
    if (!s) {
      const px = genPerson(typeof opts === 'function' ? opts() : opts, dir, frame);
      s = { img: px.canvas(), ax: 8, ay: PERSON_H - 1, w: px.w, h: px.h };
      this.cache.set(key, s);
    }
    return s;
  },
  // A player's sprite from their look (indices)
  player(look, dir, frame, binoc) {
    const l = cleanLook(look);
    return this.person('pl' + lookKey(l) + (binoc ? 'b' : ''), () => Object.assign(playerLookOpts(l), { binoc }), dir, frame);
  },

  animal(kind, frame, left, brown) {
    const key = 'an:' + kind + frame + (left ? 'L' : 'R') + (brown ? 'b' : '');
    let s = this.cache.get(key);
    if (!s) {
      let px = kind === 'sheep' ? genSheep(frame) : kind === 'horse' ? genHorse(frame) : genChicken(frame, brown);
      if (left) px = px.flipped();
      s = { img: px.canvas(), ax: px.w >> 1, ay: px.h - 2, w: px.w, h: px.h };
      this.cache.set(key, s);
    }
    return s;
  },

  portrait(npc) {
    return this._get('portrait:' + npc, () => ({ px: genPortrait(NPC_LOOKS[npc]), ax: 16, ay: 16 }));
  },
  playerPortrait(look) {
    const l = cleanLook(look);
    return this._get('pportrait:' + lookKey(l), () => ({ px: genPortrait(playerLookOpts(l)), ax: 16, ay: 16 }));
  },

  tufts(season) {
    const key = 'tufts' + season;
    let s = this.cache.get(key);
    if (!s) {
      const t = buildGrassTufts(season);
      s = { mid: t.mid.map((p) => p.canvas()), long: t.long.map((p) => p.canvas()) };
      this.cache.set(key, s);
    }
    return s;
  },

  // UI panels, cached by style & size
  panel(style, w, h) {
    w = Math.max(8, Math.round(w)); h = Math.max(8, Math.round(h));
    const key = 'panel:' + style + w + 'x' + h;
    let s = this.cache.get(key);
    if (!s) { s = genPanel(style, w, h).canvas(); this.cache.set(key, s); }
    return s;
  },
};

// ---------------------------------------------------------------- UI panels
const UI_COL = {
  ink: '#3a2614', inkSoft: '#6e5232', paper: '#f6ecd2', paperD: '#e8d8b0', wood: '#8a5a34',
  gold: '#f6c83a', red: '#c8483a', green: '#4a8a3a', blue: '#3a6ab0', muted: '#9a8464', white: '#ffffff',
};

function genPanel(style, w, h) {
  const px = new Pix(w, h);
  const cut = (c) => { px.set(0, 0, 0); px.set(w - 1, 0, 0); px.set(0, h - 1, 0); px.set(w - 1, h - 1, 0); if (c) { px.set(1, 0, 0); px.set(0, 1, 0); px.set(w - 2, 0, 0); px.set(w - 1, 1, 0); px.set(0, h - 2, 0); px.set(1, h - 1, 0); px.set(w - 1, h - 2, 0); px.set(w - 2, h - 1, 0); } };
  switch (style) {
    case 'paper': case 'note': {
      px.rect(0, 0, w, h, '#3a2614');
      px.rect(1, 1, w - 2, h - 2, style === 'note' ? '#c8b48a' : '#a8743f');
      px.rect(2, 2, w - 4, h - 4, '#3a2614');
      px.rect(3, 3, w - 6, h - 6, style === 'note' ? '#fbf4e2' : '#f6ecd2');
      px.hline(3, w - 4, 3, '#fffaee'); px.vline(3, 3, h - 4, '#fffaee');
      px.hline(3, w - 4, h - 4, '#e2d0a8'); px.vline(w - 4, 3, h - 4, '#e2d0a8');
      for (let i = 0; i < (w * h) / 60; i++) { const x = 4 + Math.floor(hashf(i, w, h) * (w - 8)), y = 4 + Math.floor(hashf(h, i, w) * (h - 8)); px.set(x, y, '#efe2c2'); }
      cut(true);
      if (style === 'note') { px.disc(w / 2, 4, 2.5, '#c83a2a'); px.set(Math.floor(w / 2) - 1, 3, '#f08070'); }
      break;
    }
    case 'wood': {
      px.rect(0, 0, w, h, '#2a1a0e');
      px.rect(1, 1, w - 2, h - 2, '#8a5a34');
      for (let y = 6; y < h - 2; y += 6) px.hline(2, w - 3, y, '#7a4e2c');
      px.hline(1, w - 2, 1, '#c89458'); px.vline(1, 1, h - 2, '#a8743f');
      px.hline(1, w - 2, h - 2, '#5a3a22'); px.vline(w - 2, 1, h - 2, '#5a3a22');
      cut(true);
      break;
    }
    case 'dark': {
      px.rect(0, 0, w, h, C('#14121c', 0.92));
      px.frame(0, 0, w, h, '#4a4458');
      px.hline(1, w - 2, 1, C('#6a6480', 0.6));
      cut(false);
      break;
    }
    case 'slot': case 'slotsel': case 'slothot': {
      px.rect(0, 0, w, h, style === 'slotsel' ? '#f6c83a' : style === 'slothot' ? '#fff0a0' : '#8a6a3a');
      px.rect(1, 1, w - 2, h - 2, '#e2d0a8');
      px.hline(1, w - 2, 1, '#b89a6a'); px.vline(1, 1, h - 2, '#b89a6a');
      px.hline(2, w - 2, h - 2, '#fff4d8'); px.vline(w - 2, 2, h - 2, '#fff4d8');
      if (style === 'slotsel') { px.frame(1, 1, w - 2, h - 2, '#fff0a0'); }
      cut(false);
      break;
    }
    case 'btn': case 'btnh': case 'btnd': case 'btnp': {
      const f = style === 'btnh' ? '#f2d690' : style === 'btnd' ? '#c8bca4' : style === 'btnp' ? '#c8a060' : '#e2c27a';
      px.rect(0, 0, w, h, '#3a2614');
      px.rect(1, 1, w - 2, h - 2, f);
      px.hline(1, w - 2, 1, lighten(f, 0.35)); px.vline(1, 1, h - 2, lighten(f, 0.2));
      px.hline(1, w - 2, h - 2, darken(f, 0.25)); px.vline(w - 2, 1, h - 2, darken(f, 0.15));
      cut(false);
      break;
    }
    case 'tab': case 'tabsel': {
      px.rect(0, 0, w, h, '#3a2614');
      px.rect(1, 1, w - 2, h - 1, style === 'tabsel' ? '#f6ecd2' : '#c8a870');
      px.hline(1, w - 2, 1, style === 'tabsel' ? '#fffaee' : '#dcc08a');
      px.set(0, 0, 0); px.set(w - 1, 0, 0);
      break;
    }
    case 'bar': {
      px.rect(0, 0, w, h, '#3a2614');
      px.rect(1, 1, w - 2, h - 2, '#5a4a3a');
      break;
    }
  }
  return px;
}

// ---- js/client/input.js ----
// Unified input: keyboard, mouse, touch (virtual stick) and gamepads.
// Game code asks for *actions* ("act", "up", "journal", ...) instead of raw keys.

const KEYMAP = {
  up: ['KeyW', 'ArrowUp'], down: ['KeyS', 'ArrowDown'], left: ['KeyA', 'ArrowLeft'], right: ['KeyD', 'ArrowRight'],
  act: ['KeyE', 'Space'], alt: ['KeyF'], enter: ['Enter', 'NumpadEnter'], cancel: ['Escape'],
  journal: ['Tab', 'KeyJ'], bag: ['KeyI', 'KeyB'], map: ['KeyM'], chat: ['KeyT'],
  prev: ['KeyQ'], next: ['KeyR'], run: ['ShiftLeft', 'ShiftRight'],
  hot1: ['Digit1'], hot2: ['Digit2'], hot3: ['Digit3'], hot4: ['Digit4'], hot5: ['Digit5'], hot6: ['Digit6'], hot7: ['Digit7'], hot8: ['Digit8'],
};
const PAD_BTN = { 0: 'act', 1: 'cancel', 2: 'alt', 3: 'journal', 4: 'prev', 5: 'next', 8: 'map', 9: 'menu', 12: 'up', 13: 'down', 14: 'left', 15: 'right' };

const Input = {
  down: new Set(),        // physical key codes held
  actDown: new Set(),     // actions held (keyboard + pad + touch)
  pressed: new Set(),     // actions pressed this frame
  mouse: { x: -1, y: -1, down: false, clicked: false, rclicked: false, wheel: 0, moved: false, inside: false },
  text: { on: false, buf: '', back: 0, enter: false, esc: false },
  lastDevice: 'kb',
  touchMode: false,
  stick: { active: false, id: -1, cx: 0, cy: 0, x: 0, y: 0 },
  padPrev: {},
  padAxes: [0, 0],
  canvas: null,
  view: null,
  uiHit: null,            // function(x, y) -> bool: is there a UI widget here?
  _queue: [],
  hiddenInput: null,

  init(canvas, view) {
    this.canvas = canvas;
    this.view = view;
    window.addEventListener('keydown', (e) => this._key(e, true));
    window.addEventListener('keyup', (e) => this._key(e, false));
    window.addEventListener('blur', () => { this.down.clear(); this.actDown.clear(); });
    canvas.addEventListener('pointerdown', (e) => this._pointer(e, 'down'));
    window.addEventListener('pointermove', (e) => this._pointer(e, 'move'));
    window.addEventListener('pointerup', (e) => this._pointer(e, 'up'));
    window.addEventListener('pointercancel', (e) => this._pointer(e, 'up'));
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());
    canvas.addEventListener('wheel', (e) => { this.mouse.wheel += Math.sign(e.deltaY); e.preventDefault(); }, { passive: false });
    window.addEventListener('gamepadconnected', () => { this.lastDevice = 'pad'; });
  },

  _key(e, isDown) {
    if (this.text.on && isDown) {
      if (e.key === 'Enter') this.text.enter = true;
      else if (e.key === 'Escape') this.text.esc = true;
      else if (e.key === 'Backspace') this.text.back++;
      else if (e.key.length === 1 && !e.ctrlKey && !e.metaKey) this.text.buf += e.key;
      if (e.target !== this.hiddenInput) e.preventDefault();
      return;
    }
    if (['Tab', 'Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter'].includes(e.code) || e.key === ' ') e.preventDefault();
    this.lastDevice = 'kb';
    this.touchMode = false;
    if (isDown) {
      if (e.repeat) return;
      this.down.add(e.code);
      for (const a in KEYMAP) if (KEYMAP[a].includes(e.code)) { this.pressed.add(a); this.actDown.add(a); }
      Audio2.unlock();
    } else {
      this.down.delete(e.code);
      for (const a in KEYMAP) if (KEYMAP[a].includes(e.code) && !KEYMAP[a].some((c) => this.down.has(c))) this.actDown.delete(a);
    }
  },

  toLogical(e) {
    const r = this.canvas.getBoundingClientRect();
    return [(e.clientX - r.left) / r.width * this.canvas.width, (e.clientY - r.top) / r.height * this.canvas.height];
  },

  _pointer(e, kind) {
    const [x, y] = this.toLogical(e);
    const touch = e.pointerType === 'touch' || e.pointerType === 'pen';
    if (kind === 'down') Audio2.unlock();
    if (touch) {
      this.touchMode = true;
      this.lastDevice = 'touch';
      if (kind === 'down') {
        const onUI = this.uiHit && this.uiHit(x, y);
        if (!onUI && !this.stick.active && x < this.canvas.width * 0.45 && G.mode === 'play' && !G.modal) {
          this.stick = { active: true, id: e.pointerId, cx: x, cy: y, x, y };
          return;
        }
        this.mouse.x = x; this.mouse.y = y; this.mouse.down = true; this.mouse.moved = true; this.mouse.inside = true;
      } else if (kind === 'move') {
        if (this.stick.active && e.pointerId === this.stick.id) { this.stick.x = x; this.stick.y = y; return; }
        if (this.mouse.down) { this.mouse.x = x; this.mouse.y = y; }
      } else {
        if (this.stick.active && e.pointerId === this.stick.id) { this.stick.active = false; return; }
        if (this.mouse.down) { this.mouse.down = false; this.mouse.clicked = true; this.mouse.x = x; this.mouse.y = y; }
        // lift the finger "out" so nothing stays hovered
        this._liftTouch = true;
      }
      return;
    }
    this.lastDevice = 'mouse';
    this.touchMode = false;
    this.mouse.x = x; this.mouse.y = y;
    this.mouse.inside = x >= 0 && y >= 0 && x < this.canvas.width && y < this.canvas.height;
    if (kind === 'move') this.mouse.moved = true;
    if (kind === 'down') {
      if (e.button === 2) this.mouse.rclicked = true;
      else { this.mouse.down = true; }
    }
    if (kind === 'up' && e.button !== 2 && this.mouse.down) { this.mouse.down = false; this.mouse.clicked = true; }
  },

  // Call once per frame before game logic
  poll() {
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    let ax = 0, ay = 0;
    for (const p of pads) {
      if (!p || !p.connected) continue;
      const lx = p.axes[0] || 0, ly = p.axes[1] || 0;
      if (Math.abs(lx) > 0.25 || Math.abs(ly) > 0.25) { ax = lx; ay = ly; this.lastDevice = 'pad'; }
      for (const b in PAD_BTN) {
        const pressed = p.buttons[b] && p.buttons[b].pressed;
        const key = p.index + ':' + b;
        const a = PAD_BTN[b];
        if (pressed && !this.padPrev[key]) { this.pressed.add(a); this.lastDevice = 'pad'; Audio2.unlock(); }
        if (pressed) this.actDown.add('pad_' + a); else this.actDown.delete('pad_' + a);
        this.padPrev[key] = pressed;
      }
      // left stick as menu navigation (edge-triggered)
      const nav = Math.abs(lx) > 0.6 ? (lx < 0 ? 'left' : 'right') : Math.abs(ly) > 0.6 ? (ly < 0 ? 'up' : 'down') : '';
      if (nav && nav !== this._padNav) this.pressed.add('nav_' + nav);
      this._padNav = nav;
    }
    this.padAxes = [ax, ay];
    for (const a of this._queue) this.pressed.add(a);
    this._queue = [];
  },

  inject(action) { this._queue.push(action); },

  // Call at the end of each frame
  endFrame() {
    this.pressed.clear();
    this.mouse.clicked = false;
    this.mouse.rclicked = false;
    this.mouse.wheel = 0;
    this.mouse.moved = false;
    this.text.buf = ''; this.text.back = 0; this.text.enter = false; this.text.esc = false;
    if (this._liftTouch) { this._liftTouch = false; this.mouse.x = -100; this.mouse.y = -100; }
  },

  held(a) { return this.actDown.has(a) || this.actDown.has('pad_' + a); },
  hit(a) { return this.pressed.has(a); },
  // menu navigation (keyboard arrows/WASD, d-pad, stick)
  nav(dir) { return this.pressed.has(dir) || this.pressed.has('nav_' + dir); },

  // Movement vector in [-1, 1]
  move() {
    let x = 0, y = 0;
    if (this.held('left')) x -= 1;
    if (this.held('right')) x += 1;
    if (this.held('up')) y -= 1;
    if (this.held('down')) y += 1;
    if (Math.abs(this.padAxes[0]) > 0.25 || Math.abs(this.padAxes[1]) > 0.25) { x = this.padAxes[0]; y = this.padAxes[1]; }
    if (this.stick.active) {
      const dx = this.stick.x - this.stick.cx, dy = this.stick.y - this.stick.cy, d = Math.hypot(dx, dy);
      if (d > 4) { const m = Math.min(1, d / 24); x = dx / d * m; y = dy / d * m; }
    }
    const l = Math.hypot(x, y);
    if (l > 1) { x /= l; y /= l; }
    return [x, y];
  },

  startText(initial) {
    this.text.on = true;
    if (this.touchMode) {
      if (!this.hiddenInput) {
        const inp = document.createElement('input');
        inp.type = 'text';
        inp.autocomplete = 'off';
        inp.style.cssText = 'position:fixed;left:-1000px;top:0;opacity:0;';
        inp.addEventListener('input', () => { this.text.buf += inp.value; inp.value = ''; });
        inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') this.text.enter = true; if (e.key === 'Backspace') this.text.back++; });
        document.body.appendChild(inp);
        this.hiddenInput = inp;
      }
      this.hiddenInput.value = '';
      this.hiddenInput.focus();
    }
  },
  stopText() {
    this.text.on = false;
    if (this.hiddenInput) this.hiddenInput.blur();
  },

  // Label for a prompt key depending on the last used device
  keyLabel(action) {
    const pad = this.lastDevice === 'pad', touch = this.lastDevice === 'touch';
    const map = {
      act: pad ? 'A' : touch ? 'A' : 'E', alt: pad ? 'X' : touch ? 'B' : 'F', cancel: pad ? 'B' : 'Esc', ok: pad ? 'A' : 'Space',
      journal: pad ? 'Y' : 'Tab', map: pad ? 'Back' : 'M', bag: 'I',
    };
    return map[action] || action;
  },
};

// ---- js/client/audio.js ----
// All sound is synthesised with the Web Audio API: effects, bird songs and gentle music.
// (Named Audio2 to avoid clashing with the browser's built-in Audio constructor.)

const Audio2 = {
  ctx: null, master: null, sfxGain: null, musicGain: null, ambGain: null,
  vol: { music: 0.5, sfx: 0.8 },
  unlocked: false,
  musicOn: true,
  noiseBuf: null,
  listener: { x: 0, y: 0 },
  rainNode: null,
  nextNote: 0, step: 0, mood: null,

  loadPrefs() {
    try {
      const p = JSON.parse(localStorage.getItem('nested.audio') || '{}');
      if (typeof p.music === 'number') this.vol.music = p.music;
      if (typeof p.sfx === 'number') this.vol.sfx = p.sfx;
    } catch (e) { /* ignore */ }
  },
  savePrefs() { try { localStorage.setItem('nested.audio', JSON.stringify(this.vol)); } catch (e) { /* ignore */ } },

  unlock() {
    if (this.unlocked) { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      this.ctx = new AC();
    } catch (e) { return; }
    this.unlocked = true;
    const c = this.ctx;
    this.master = c.createGain(); this.master.gain.value = 0.9; this.master.connect(c.destination);
    const comp = c.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4; comp.connect(this.master);
    this.sfxGain = c.createGain(); this.sfxGain.connect(comp);
    this.musicGain = c.createGain(); this.musicGain.connect(comp);
    this.ambGain = c.createGain(); this.ambGain.connect(comp);
    this.applyVolumes();
    const len = c.sampleRate * 1.5;
    this.noiseBuf = c.createBuffer(1, len, c.sampleRate);
    const d = this.noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.nextNote = c.currentTime + 0.5;
  },

  applyVolumes() {
    if (!this.ctx) return;
    this.sfxGain.gain.value = this.vol.sfx;
    this.musicGain.gain.value = this.vol.music * 0.35;
    this.ambGain.gain.value = this.vol.sfx * 0.6;
  },

  // --------------------------------------------------------------- primitives
  _out(x, y) {
    // spatial: volume & pan by distance to listener
    const c = this.ctx;
    const g = c.createGain();
    let v = 1;
    if (x != null) {
      const dx = x - this.listener.x, dy = y - this.listener.y, d = Math.hypot(dx, dy);
      v = clamp(1 - d / 260, 0, 1);
      if (c.createStereoPanner) {
        const p = c.createStereoPanner();
        p.pan.value = clamp(dx / 200, -0.8, 0.8);
        g.connect(p); p.connect(this.sfxGain);
      } else g.connect(this.sfxGain);
    } else g.connect(this.sfxGain);
    g.gain.value = v;
    return v > 0.01 ? g : null;
  },

  tone(dest, t, f0, f1, dur, vol, type, attack) {
    const c = this.ctx;
    const o = c.createOscillator();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f0, t);
    if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
    const g = c.createGain();
    const a = attack || 0.005;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest);
    o.start(t); o.stop(t + dur + 0.02);
    return o;
  },

  noise(dest, t, dur, vol, ftype, f0, f1, q) {
    const c = this.ctx;
    const s = c.createBufferSource();
    s.buffer = this.noiseBuf;
    const f = c.createBiquadFilter();
    f.type = ftype || 'bandpass';
    f.frequency.setValueAtTime(f0 || 2000, t);
    if (f1) f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    f.Q.value = q || 1;
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(dest);
    s.start(t, Math.random() * 1.0); s.stop(t + dur + 0.02);
  },

  // --------------------------------------------------------------- effects
  sfx(name, x, y) {
    if (!this.ctx) return;
    const d = this._out(x, y);
    if (!d) return;
    const t = this.ctx.currentTime + 0.01;
    switch (name) {
      case 'step': this.noise(d, t, 0.06, 0.05, 'lowpass', 900, 400, 0.7); break;
      case 'stepw': this.noise(d, t, 0.1, 0.07, 'bandpass', 1400, 600, 1.5); break;
      case 'rustle': this.noise(d, t, 0.22, 0.25, 'bandpass', 3200, 1800, 0.8); this.noise(d, t + 0.08, 0.18, 0.15, 'bandpass', 4200, 2400, 1); break;
      case 'shake': for (let i = 0; i < 4; i++) this.noise(d, t + i * 0.06, 0.12, 0.2, 'bandpass', 2600 + i * 300, 1600, 0.9); break;
      case 'pop': this.tone(d, t, 620, 990, 0.09, 0.22, 'sine'); this.tone(d, t + 0.05, 990, 1320, 0.08, 0.14, 'triangle'); break;
      case 'pickup': this.tone(d, t, 880, 880, 0.07, 0.18, 'square'); this.tone(d, t + 0.06, 1320, 1320, 0.1, 0.12, 'square'); break;
      case 'mud': this.noise(d, t, 0.25, 0.3, 'lowpass', 600, 180, 1.2); this.tone(d, t, 180, 90, 0.2, 0.18, 'sine'); break;
      case 'scrape': for (let i = 0; i < 5; i++) this.noise(d, t + i * 0.035, 0.05, 0.15, 'highpass', 3000, 0, 0.7); break;
      case 'dig': this.noise(d, t, 0.18, 0.3, 'lowpass', 1200, 300, 1); this.tone(d, t, 140, 80, 0.12, 0.2, 'triangle'); break;
      case 'splash': this.noise(d, t, 0.45, 0.35, 'bandpass', 1800, 500, 0.8); this.noise(d, t + 0.05, 0.3, 0.2, 'highpass', 4000, 0, 1); break;
      case 'silk': for (let i = 0; i < 4; i++) this.tone(d, t + i * 0.05, 2400 + i * 400, 2600 + i * 400, 0.12, 0.05, 'sine'); break;
      case 'crumble': for (let i = 0; i < 6; i++) this.noise(d, t + i * 0.04, 0.06, 0.18, 'bandpass', 900 + Math.random() * 600, 0, 2); break;
      case 'place': this.tone(d, t, 220, 160, 0.12, 0.3, 'triangle'); this.noise(d, t, 0.1, 0.2, 'lowpass', 800, 0, 1); break;
      case 'plant': this.noise(d, t, 0.15, 0.2, 'lowpass', 900, 300, 1); this.tone(d, t + 0.08, 520, 780, 0.12, 0.1, 'sine'); break;
      case 'build': [523, 659, 784, 1046].forEach((f, i) => this.tone(d, t + i * 0.09, f, f, 0.25, 0.14, 'triangle')); this.noise(d, t, 0.3, 0.15, 'bandpass', 2400, 1200, 1); break;
      case 'craft': [392, 523, 659].forEach((f, i) => this.tone(d, t + i * 0.08, f, f, 0.18, 0.13, 'square')); this.noise(d, t, 0.08, 0.3, 'lowpass', 1500, 0, 1); break;
      case 'coin': this.tone(d, t, 988, 988, 0.08, 0.15, 'square'); this.tone(d, t + 0.07, 1319, 1319, 0.22, 0.13, 'square'); break;
      case 'click': this.tone(d, t, 1400, 1100, 0.04, 0.08, 'square'); break;
      case 'tick': this.tone(d, t, 1800, 1800, 0.02, 0.05, 'square'); break;
      case 'open': this.tone(d, t, 440, 660, 0.1, 0.1, 'triangle'); this.noise(d, t, 0.12, 0.08, 'bandpass', 3000, 2000, 1); break;
      case 'close': this.tone(d, t, 660, 440, 0.1, 0.1, 'triangle'); break;
      case 'error': this.tone(d, t, 180, 140, 0.18, 0.18, 'sawtooth'); break;
      case 'page': this.noise(d, t, 0.18, 0.15, 'bandpass', 5000, 2500, 0.6); break;
      case 'clue': [784, 988, 1175, 1568].forEach((f, i) => this.tone(d, t + i * 0.1, f, f, 0.3, 0.12, 'sine')); break;
      case 'arrive': [659, 784, 988].forEach((f, i) => this.tone(d, t + i * 0.12, f, f * 1.01, 0.3, 0.12, 'triangle')); break;
      case 'fanfare': [523, 659, 784, 1046, 784, 1046, 1318].forEach((f, i) => this.tone(d, t + i * 0.13, f, f, i === 6 ? 0.6 : 0.2, 0.15, 'square')); break;
      case 'chirps': for (let i = 0; i < 6; i++) this.tone(d, t + i * 0.07 + Math.random() * 0.03, 3600 + Math.random() * 900, 4200, 0.05, 0.05, 'sine'); break;
      case 'brush': for (let i = 0; i < 3; i++) this.noise(d, t + i * 0.1, 0.12, 0.12, 'bandpass', 2200, 1600, 1); break;
      case 'sleep': [392, 330, 262].forEach((f, i) => this.tone(d, t + i * 0.25, f, f, 0.5, 0.12, 'sine', 0.05)); break;
      case 'mail': this.tone(d, t, 880, 880, 0.12, 0.12, 'sine'); this.tone(d, t + 0.14, 1175, 1175, 0.2, 0.12, 'sine'); break;
      case 'quack': for (let i = 0; i < 2; i++) { const o = this.tone(d, t + i * 0.22, 420, 300, 0.16, 0.12, 'sawtooth'); void o; } break;
      case 'neigh': this.tone(d, t, 600, 900, 0.3, 0.06, 'sawtooth'); this.tone(d, t + 0.3, 900, 500, 0.4, 0.06, 'sawtooth'); break;
      case 'baa': this.tone(d, t, 330, 300, 0.4, 0.07, 'sawtooth', 0.04); break;
      case 'knock': for (let i = 0; i < 3; i++) { this.noise(d, t + i * 0.16, 0.06, 0.4, 'lowpass', 500, 120, 2); this.tone(d, t + i * 0.16, 160, 110, 0.06, 0.2, 'triangle'); } break;
      case 'cluck': for (let i = 0; i < 3; i++) this.tone(d, t + i * 0.1, 700, 500, 0.06, 0.08, 'square'); break;
    }
  },

  // --------------------------------------------------------------- bird songs
  song(spId, x, y) {
    if (!this.ctx) return;
    const d = this._out(x, y);
    if (!d) return;
    const t = this.ctx.currentTime + 0.02;
    const R = Math.random;
    const T = (dt, f0, f1, dur, v, type) => this.tone(d, t + dt, f0, f1, dur, v == null ? 0.07 : v, type || 'sine');
    switch (spId) {
      case 'blackbird': { // mellow fluting phrase ending in a squeaky twitter
        let k = 0;
        for (let i = 0; i < 5; i++) { const f = 1400 + R() * 900; T(k, f, f * (0.9 + R() * 0.25), 0.18 + R() * 0.12, 0.08); k += 0.22 + R() * 0.08; }
        for (let i = 0; i < 4; i++) T(k + i * 0.05, 4500 + R() * 1500, 5200, 0.04, 0.035);
        break;
      }
      case 'robin': { let k = 0; for (let i = 0; i < 7; i++) { const f = 3000 + R() * 3500; T(k, f, f * (R() < 0.5 ? 0.7 : 1.3), 0.08 + R() * 0.1, 0.05); k += 0.12 + R() * 0.1; } break; }
      case 'greattit': for (let i = 0; i < 3; i++) { T(i * 0.42, 5600, 5400, 0.14, 0.06); T(i * 0.42 + 0.18, 4100, 4000, 0.16, 0.06); } break;
      case 'bluetit': { T(0, 6800, 6600, 0.12, 0.04); T(0.18, 6800, 6600, 0.12, 0.04); for (let i = 0; i < 8; i++) T(0.4 + i * 0.06, 4600, 4300, 0.05, 0.045); break; }
      case 'songthrush': { let k = 0; for (let p = 0; p < 3; p++) { const f = 2200 + R() * 2500, f2 = f * (0.8 + R() * 0.5), n = 2 + Math.floor(R() * 2); for (let r = 0; r < n; r++) { T(k, f, f2, 0.09, 0.07); T(k + 0.1, f2, f, 0.08, 0.06); k += 0.24; } k += 0.15; } break; }
      case 'woodpigeon': { const s = [[0, 0.35, 380], [0.45, 0.5, 420], [1.0, 0.3, 380], [1.4, 0.3, 360], [1.75, 0.25, 340]]; for (const [k, dur, f] of s) T(k, f, f * 0.92, dur, 0.13, 'sine'); break; }
      case 'wren': { let k = 0; for (let i = 0; i < 26; i++) { const f = 4000 + R() * 3500; T(k, f, f * (0.85 + R() * 0.3), 0.04, 0.07); k += 0.045 + (i % 9 === 8 ? 0.12 : 0); } break; }
      case 'swallow': { let k = 0; for (let i = 0; i < 12; i++) { const f = 3000 + R() * 2500; T(k, f, f * (0.8 + R() * 0.4), 0.05, 0.045); k += 0.07 + R() * 0.06; } for (let i = 0; i < 6; i++) this.noise(d, t + k + i * 0.025, 0.02, 0.05, 'bandpass', 3500, 0, 4); break; }
      case 'martin': for (let i = 0; i < 4; i++) { T(i * 0.2, 2800, 3600, 0.06, 0.05); T(i * 0.2 + 0.07, 3600, 2900, 0.06, 0.04); } break;
      case 'mallard': for (let i = 0; i < 4; i++) { const k = i * 0.25; const v = 0.12 - i * 0.02; this.tone(d, t + k, 520, 360, 0.18, v, 'sawtooth'); this.noise(d, t + k, 0.15, v * 0.6, 'bandpass', 1100, 700, 3); } break;
      case 'goldfinch': { let k = 0; for (let i = 0; i < 16; i++) { const f = 3500 + R() * 3500; T(k, f, f * (0.85 + R() * 0.35), 0.05, 0.05); k += 0.06 + R() * 0.04; } break; }
      case 'longtailed': { for (let i = 0; i < 3; i++) T(i * 0.12, 7500, 7300, 0.08, 0.04); for (let i = 0; i < 5; i++) this.noise(d, t + 0.45 + i * 0.03, 0.03, 0.06, 'bandpass', 3000, 0, 5); break; }
      case 'woodpecker': { for (let i = 0; i < 16; i++) this.noise(d, t + i * 0.045, 0.03, 0.4 - i * 0.015, 'bandpass', 700, 0, 3); T(1.0, 2600, 2200, 0.05, 0.06, 'square'); break; }
      case 'reedwarbler': { let k = 0; for (let i = 0; i < 18; i++) { const harsh = R() < 0.35; if (harsh) this.noise(d, t + k, 0.05, 0.08, 'bandpass', 2500, 0, 3); else T(k, 2500 + R() * 2500, 2200 + R() * 2000, 0.06, 0.05); k += 0.08 + (i % 3 === 2 ? 0.05 : 0); } break; }
      case 'crossbill': for (let i = 0; i < 4; i++) T(i * 0.14, 3200, 2600, 0.05, 0.07, 'square'); break;
      case 'kingfisher': for (let i = 0; i < 3; i++) T(i * 0.25, 6000, 7000, 0.12, 0.07); break;
      case 'barnowl': { this.noise(d, t, 1.4, 0.18, 'bandpass', 2600, 3400, 2.2); this.noise(d, t, 1.2, 0.1, 'bandpass', 4500, 5200, 3); break; }
      case 'penduline': T(0, 6500, 4200, 0.6, 0.05); T(0.9, 6400, 4300, 0.55, 0.04); break;
      case 'cuckoo': for (let i = 0; i < 3; i++) { T(i * 0.9, 700, 690, 0.22, 0.13, 'sine'); T(i * 0.9 + 0.3, 580, 570, 0.32, 0.13, 'sine'); } break;
      case 'stork': { for (let i = 0; i < 22; i++) { const g = Math.sin(i / 22 * Math.PI); this.noise(d, t + i * 0.06 - g * 0.01, 0.025, 0.12 + g * 0.2, 'bandpass', 1400, 0, 2); } break; }
      case 'nuthatch': for (let i = 0; i < 6; i++) T(i * 0.13, 2300, 3300, 0.07, 0.08); break;
      case 'skylark': { let k = 0; for (let i = 0; i < 46; i++) { const f = 2600 + R() * 3200; T(k, f, f * (0.85 + R() * 0.3), 0.045, 0.045); k += 0.05 + (R() < 0.08 ? 0.08 : 0); } break; }
      case 'plover': T(0, 3700, 2700, 0.32, 0.07); T(0.6, 3700, 2700, 0.3, 0.06); break;
      case 'swift': for (let i = 0; i < 3; i++) { T(i * 0.45, 5400, 6600, 0.32, 0.04); this.noise(d, t + i * 0.45, 0.32, 0.05, 'bandpass', 6200, 5600, 6); } break;
      case 'tawny': { // the male's quavering hoot
        T(0, 560, 520, 0.42, 0.13, 'sine');
        for (let i = 0; i < 3; i++) T(1.0 + i * 0.12, 600, 560, 0.09, 0.09, 'sine');
        for (let i = 0; i < 9; i++) T(1.45 + i * 0.09, 590 - i * 6, 570 - i * 6, 0.09, 0.12 - i * 0.008, 'sine');
        break;
      }
      case 'heron': this.tone(d, t, 320, 220, 0.38, 0.1, 'sawtooth'); this.noise(d, t, 0.38, 0.16, 'bandpass', 900, 600, 2); break;
      case 'shrike': { for (let i = 0; i < 3; i++) this.noise(d, t + i * 0.16, 0.06, 0.12, 'bandpass', 2800, 0, 3); let k = 0.6; for (let i = 0; i < 7; i++) { const f = 2400 + R() * 2600; T(k, f, f * (0.85 + R() * 0.3), 0.07, 0.04); k += 0.1; } break; }
      case 'beeeater': for (let i = 0; i < 3; i++) for (let j = 0; j < 6; j++) T(i * 0.42 + j * 0.026, 2250 + j * 50, 2350 + j * 50, 0.024, 0.05, 'triangle'); break;
      case 'flycatcher': { T(0, 5200, 5000, 0.08, 0.05); T(0.12, 4400, 4600, 0.07, 0.05); T(0.24, 5200, 5000, 0.08, 0.05); T(0.36, 3800, 4200, 0.12, 0.05); break; }
      case 'nightingale': {
        let k = 0;
        for (let i = 0; i < 4; i++) { T(k, 1300, 1250, 0.32, 0.03 + i * 0.02, 'sine'); k += 0.42; }
        for (let i = 0; i < 6; i++) { this.tone(d, t + k + i * 0.06, 900, 700, 0.05, 0.1, 'square'); }
        k += 0.5;
        for (let i = 0; i < 10; i++) { const f = 2500 + R() * 3500; T(k, f, f * (0.8 + R() * 0.4), 0.06, 0.06); k += 0.08; }
        break;
      }
      case 'dipper': { let k = 0; for (let i = 0; i < 3; i++) { T(k, 6000, 5200, 0.04, 0.06); k += 0.12; } for (let i = 0; i < 8; i++) { const f = 3500 + R() * 2500; T(k, f, f * 0.9, 0.05, 0.04); k += 0.07; } break; }
      case 'sandmartin': for (let i = 0; i < 8; i++) this.noise(d, t + i * 0.09 + R() * 0.03, 0.05, 0.08, 'bandpass', 3800, 3000, 4); break;
      case 'jackdaw': for (let i = 0; i < 2; i++) { this.tone(d, t + i * 0.32, 1300, 1100, 0.09, 0.08, 'square'); this.noise(d, t + i * 0.32, 0.08, 0.1, 'bandpass', 1600, 1200, 3); } break;
      case 'nightjar': { for (let i = 0; i < 60; i++) this.tone(d, t + i * 0.035, i % 2 ? 1550 : 1750, i % 2 ? 1500 : 1700, 0.03, 0.05, 'square'); break; }
      case 'longeared': T(0, 330, 310, 0.35, 0.12, 'sine'); T(2.4, 330, 310, 0.35, 0.12, 'sine'); break;
      case 'corncrake': for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) this.noise(d, t + i * 0.6 + j * 0.2, 0.14, 0.14, 'bandpass', 2400, 2600, 5); break;
      case 'eagleowl': T(0, 210, 230, 0.25, 0.16, 'sine'); T(0.45, 240, 200, 0.4, 0.14, 'sine'); break;
      case 'littleowl': T(0, 1400, 1050, 0.4, 0.08, 'sine'); T(1.2, 1450, 1080, 0.38, 0.07, 'sine'); break;
      case 'woodcock': T(0, 600, 560, 0.12, 0.06, 'sawtooth'); T(0.14, 600, 560, 0.12, 0.06, 'sawtooth'); T(0.5, 6500, 7200, 0.08, 0.04); break;
      case 'sparrow': for (let i = 0; i < 5; i++) { const f = 3200 + R() * 600; T(i * 0.22, f, f * 0.85, 0.08, 0.06, 'triangle'); } break;
      case 'starling': { let k = 0; for (let i = 0; i < 10; i++) { const r = R(); if (r < 0.3) this.noise(d, t + k, 0.05, 0.06, 'bandpass', 3000 + R() * 2000, 0, 6); else T(k, 1500 + R() * 4000, 1500 + R() * 4000, 0.1 + R() * 0.15, 0.05); k += 0.14 + R() * 0.1; } break; }
      case 'magpie': for (let i = 0; i < 6; i++) { this.noise(d, t + i * 0.11, 0.07, 0.16, 'bandpass', 1900, 1500, 2.5); this.tone(d, t + i * 0.11, 900, 700, 0.06, 0.04, 'sawtooth'); } break;
      default: T(0, 4000, 3500, 0.1, 0.05);
    }
  },

  // --------------------------------------------------------------- ambience
  setRain(on) {
    if (!this.ctx) return;
    if (on && !this.rainNode) {
      const c = this.ctx;
      const s = c.createBufferSource(); s.buffer = this.noiseBuf; s.loop = true;
      const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 1400;
      const g = c.createGain(); g.gain.value = 0.0001; g.gain.exponentialRampToValueAtTime(0.25, c.currentTime + 2);
      s.connect(f); f.connect(g); g.connect(this.ambGain); s.start();
      this.rainNode = { s, g };
    } else if (!on && this.rainNode) {
      const r = this.rainNode; this.rainNode = null;
      r.g.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + 1.5);
      r.s.stop(this.ctx.currentTime + 1.6);
    }
  },

  // --------------------------------------------------------------- music
  // A soft, sparse, generative tune per season & time of day.
  updateMusic(season, minute, enabled) {
    if (!this.ctx || !enabled || this.vol.music <= 0.001) return;
    const c = this.ctx;
    const night = minute >= 20 * 60 || minute < 6 * 60;
    const scales = [
      [0, 2, 4, 7, 9, 12, 14, 16],   // spring: major pentatonic
      [0, 2, 4, 7, 9, 12, 14, 16],   // summer
      [0, 2, 3, 7, 9, 12, 14, 15],   // autumn: dorian-ish
      [0, 3, 5, 7, 10, 12, 15, 17],  // winter: minor pentatonic
    ];
    const roots = [65, 67, 62, 57];  // F, G, D, A (midi)
    const tempo = night ? 0.9 : [0.5, 0.45, 0.55, 0.65][season];
    const prog = [0, 5, 3, 4];
    while (this.nextNote < c.currentTime + 0.3) {
      const t = this.nextNote;
      const bar = Math.floor(this.step / 8) % 4;
      const chordRoot = roots[season] - 12 + [0, 9, 5, 7][prog[bar] % 4];
      const midi = (m) => 440 * Math.pow(2, (m - 69) / 12);
      if (this.step % 8 === 0) {
        // soft pad chord
        for (const iv of [0, 7, 12 + (season === WINTER || season === AUTUMN ? 3 : 4)]) {
          this.tone(this.musicGain, t, midi(chordRoot + iv), midi(chordRoot + iv), tempo * 7.5, night ? 0.025 : 0.035, 'sine', 0.8);
        }
        this.tone(this.musicGain, t, midi(chordRoot - 12), midi(chordRoot - 12), tempo * 6, 0.05, 'triangle', 0.3);
      }
      const sc = scales[season];
      const play = night ? Math.random() < 0.25 : Math.random() < (this.step % 2 === 0 ? 0.55 : 0.3);
      if (play) {
        const deg = sc[Math.floor(Math.random() * sc.length)];
        const f = midi(roots[season] + deg);
        this.tone(this.musicGain, t, f, f, tempo * (1.2 + Math.random()), night ? 0.035 : 0.05, 'triangle', 0.01);
        if (Math.random() < 0.2) this.tone(this.musicGain, t + tempo / 2, f * 2, f * 2, tempo, 0.02, 'sine', 0.01);
      }
      this.step++;
      this.nextNote += tempo;
    }
  },
};

// ---- js/client/state.js ----
// Client-side mirror of the world. Built from a snapshot and kept current by host events.
// It has the same shape as the World (tiles, grass, objs, occ, byTile, time, ...) so the
// shared rule functions work on both.

class ClientState {
  constructor() {
    this.objs = new Map();
    this.occ = new Int32Array(MAP_W * MAP_H);
    this.byTile = new Map();
    this.players = new Map();
    this.animals = new Map();
    this.dirtyTiles = new Set();
    this.allDirty = true;
    this.clockMs = 0;
  }

  loadSnap(s) {
    this.name = s.name; this.seed = s.seed; this.me = s.you;
    this.tiles = b64decode(s.tiles);
    this.grass = b64decode(s.grass);
    this.objs = new Map();
    this.occ = new Int32Array(MAP_W * MAP_H);
    this.byTile = new Map();
    for (const o of s.objs) idxAdd(this, o);
    this.time = s.time; this.weather = s.weather; this.coins = s.coins; this.mats = s.mats;
    this.journal = s.journal; this.log = s.log || []; this.mail = s.mail || []; this.quest = s.quest;
    this.visitors = s.visitors || []; this.featured = s.featured || [];
    this.dug = s.dug || {};
    this.inv = s.inv || [];
    this.side = s.side || {};
    this.found = s.found || {};
    this.stats = s.stats || {};
    this.allDone = !!s.allDone;
    const old = this.players;
    this.players = new Map();
    for (const p of s.players) {
      const prev = old.get(p.pid);
      this.players.set(p.pid, Object.assign({ tx: p.x, ty: p.y, m: 0, a: '', walkT: 0 }, prev || {}, p, { tx: p.x, ty: p.y }));
    }
    this.animals = new Map();
    for (const a of s.animals || []) this._animal(a);
    this.sleepN = 0; this.sleepTotal = this.players.size;
    this.allDirty = true;
    this.clockMs = 0;
  }

  _animal(a) {
    const [id, kind, x, y, d, m] = a;
    let an = this.animals.get(id);
    if (!an) { an = { id, kind, x, y, tx: x, ty: y, d, m, t: Math.random() * 1000, brown: hashf(id.length, id.charCodeAt(1), 3) < 0.4 }; this.animals.set(id, an); }
    an.tx = x; an.ty = y; an.d = d; an.m = m;
  }

  get meP() { return this.players.get(this.me); }

  onPositions(msg) {
    for (const [pid, x, y, d, m, a, sl] of msg.p) {
      const p = this.players.get(pid);
      if (!p) continue;
      p.sleep = !!sl;
      if (pid === this.me) continue;
      p.tx = x; p.ty = y; p.d = d; p.m = m; p.a = a;
    }
    if (msg.a) for (const a of msg.a) this._animal(a);
  }

  markTile(i) { this.dirtyTiles.add(i); }

  // Returns a list of "notes" the game layer reacts to (sounds, popups, ...)
  apply(evs, game) {
    for (const e of evs) {
      switch (e[0]) {
        case 'oa': {
          const o = e[1];
          const old = this.objs.get(o.id);
          if (old) idxRemove(this, old);
          idxAdd(this, o);
          game.onObjAdded(o);
          break;
        }
        case 'ou': {
          const o = this.objs.get(e[1]);
          if (!o) break;
          const prevSt = o.st;
          Object.assign(o, e[2]);
          game.onObjUpdated(o, e[2], prevSt);
          break;
        }
        case 'or': {
          const o = this.objs.get(e[1]);
          if (o) { idxRemove(this, o); game.onObjRemoved(o); }
          break;
        }
        case 'tile': this.tiles[e[1]] = e[2]; this.markTile(e[1]); break;
        case 'gr': this.grass[e[1]] = e[2]; break;
        case 'dug': this.dug[e[1]] = e[2]; break;
        case 'time': {
          const prevSeason = this.time.season;
          this.time = e[1]; this.weather = e[2]; this.clockMs = 0;
          if (prevSeason !== this.time.season) this.allDirty = true;
          break;
        }
        case 'coins': game.onCoins(e[1] - this.coins); this.coins = e[1]; break;
        case 'mats': Object.assign(this.mats, e[1]); break;
        case 'inv': this.inv = e[1]; game.onInv(); break;
        case 'jr': this.journal[e[1]] = e[2]; break;
        case 'clue':
          this.log.push({ sp: e[1], i: e[2], d: dateStr(this.time), src: e[3], by: e[5] });
          game.onClue(e[1], e[2], e[3], e[4], e[5]);
          break;
        case 'toast': game.toast(e[1], e[2]); break;
        case 'fx': game.onFx(e[1], e[2], e[3], e[4]); break;
        case 'snd': if (e[2] || e[3]) Audio2.sfx(e[1], e[2], e[3]); else Audio2.sfx(e[1]); break;
        case 'gain': game.onGain(e[1], e[2], e[3], e[4]); break;
        case 'pj': {
          const p = e[1];
          const prev = this.players.get(p.pid);
          this.players.set(p.pid, Object.assign(prev || { m: 0, a: '', walkT: 0 }, p, { tx: p.x, ty: p.y }));
          break;
        }
        case 'pq': this.players.delete(e[1]); break;
        case 'pp': { const p = this.players.get(e[1]); if (p) Object.assign(p, e[2]); break; }
        case 'chat': game.onChat(e[1], e[2]); break;
        case 'slp': this.sleepN = e[1]; this.sleepTotal = e[2]; break;
        case 'dlg': game.onDialogue(e[1]); break;
        case 'fact': game.onFact(e[1], e[2]); break;
        case 'mail': this.mail.push(e[1]); if (this.mail.length > 60) this.mail.shift(); game.onMail(e[1]); break;
        case 'mailr': { const l = this.mail.find((m) => m.id === e[1]); if (l) l.read = true; break; }
        case 'quest': this.quest = e[1]; break;
        case 'vis': this.visitors = e[1]; this.featured = e[2]; game.onVisitors(); break;
        case 'tp': game.onTeleport(e[1], e[2]); break;
        case 'side': this.side = e[1]; break;
        case 'found': this.found = e[1]; this.mapDirty = true; break;
        case 'lore': game.onLore(e[1], e[2]); break;
      }
    }
  }

  // Interpolated game clock (minutes) between authoritative updates
  clock() { return this.time.min + this.clockMs / MS_PER_MIN; }
}

// ---- js/client/fx.js ----
// Particles, floating texts and item icons flying to the player.

const HEART_PX = ['.#.#.', '#####', '#####', '.###.', '..#..'];
const NOTE_PX = ['..##', '..#.', '..#.', '###.', '##..'];

class FX {
  constructor() { this.parts = []; this.texts = []; this.flyers = []; }

  burst(kind, x, y, n, season) {
    const R = Math.random;
    for (let i = 0; i < n; i++) {
      const p = { kind, x: x + (R() - 0.5) * 8, y: y + (R() - 0.5) * 6, vx: (R() - 0.5) * 40, vy: -20 - R() * 40, g: 120, life: 0.6 + R() * 0.4, t: 0, size: 1 + (R() < 0.3 ? 1 : 0) };
      switch (kind) {
        case 'leaf': {
          const cols = season === AUTUMN ? ['#c8662a', '#e09a3a', '#a4482a', '#f2c254'] : season === WINTER ? ['#f4f8fb', '#dfe7f0'] : ['#5aa040', '#7dbe55', '#3e7a34'];
          p.c = pick(cols); p.vy = -10 - R() * 20; p.g = 30; p.life = 1.2 + R() * 1; p.sway = R() * 6; break;
        }
        case 'twig': p.c = pick(['#7a5a3a', '#5a3e26']); p.size = 2; break;
        case 'grass': p.c = pick(['#5aa048', '#7cbc58', '#c8b06a']); break;
        case 'mud': p.c = pick(['#5e4630', '#7c6044']); p.size = 2; p.vy = -30 - R() * 30; break;
        case 'dust': p.c = pick(['#d8c8a8', '#c8b898']); p.vy = -8 - R() * 10; p.g = -5; p.vx *= 0.5; p.size = 2; break;
        case 'sparkle': p.c = pick(['#fff4b0', '#ffffff', '#f6d860']); p.vy = -15 - R() * 20; p.g = 10; p.life = 0.7 + R() * 0.6; break;
        case 'heart': p.c = '#e8485a'; p.vx *= 0.3; p.vy = -14 - R() * 8; p.g = 0; p.life = 1.4; break;
        case 'note': p.c = pick(['#3a3a5a', '#5a4a8a']); p.vx = (R() - 0.5) * 10; p.vy = -16; p.g = 0; p.life = 1.6; p.sway = 3; break;
        case 'splash': p.c = pick(['#8cd2ea', '#d6f0f6', '#5eb6d6']); p.vy = -40 - R() * 40; p.g = 220; break;
        case 'feather': p.c = '#f4f2ee'; p.vy = -10; p.g = 12; p.life = 2; p.sway = 8; p.size = 2; break;
        case 'chip': p.c = pick(['#e8d8b0', '#c8a070']); p.vy = -10; break;
        case 'silk': p.c = '#ffffff'; p.vy = -12; p.g = 0; p.life = 0.8; break;
        case 'zzz': p.c = '#e8eef8'; p.vx = 4; p.vy = -10; p.g = 0; p.life = 2; break;
        case 'smoke': p.c = pick(['#d8d4d0', '#c8c4c0', '#e8e4e0']); p.vx = 3 + R() * 4; p.vy = -10 - R() * 5; p.g = 0; p.life = 2.5 + R(); p.size = 2 + (R() < 0.5 ? 1 : 0); break;
        case 'drip': p.c = '#8cd2ea'; p.vx = 0; p.vy = 0; p.g = 160; p.life = 0.5; break;
        case 'ripple': p.c = '#d6f0f6'; p.vx = 0; p.vy = 0; p.g = 0; p.life = 0.8; break;
      }
      this.parts.push(p);
    }
  }

  text(str, x, y, color, icon) {
    this.texts.push({ str, x, y, color: color || '#ffffff', icon, t: 0, life: 1.4 });
  }

  fly(icon, fx, fy, target, onArrive) {
    this.flyers.push({ icon, fx, fy, target, t: 0, life: 0.45, onArrive });
  }

  update(dt) {
    const s = dt / 1000;
    for (const p of this.parts) {
      p.t += s;
      p.vy += p.g * s;
      p.x += p.vx * s + (p.sway ? Math.sin(p.t * 5) * p.sway * s : 0);
      p.y += p.vy * s;
      if (p.kind === 'leaf' || p.kind === 'feather') p.vx *= 0.98;
    }
    this.parts = this.parts.filter((p) => p.t < p.life);
    for (const t of this.texts) t.t += s;
    this.texts = this.texts.filter((t) => t.t < t.life);
    for (const f of this.flyers) {
      f.t += s;
      if (f.t >= f.life && !f.done) { f.done = true; if (f.onArrive) f.onArrive(); }
    }
    this.flyers = this.flyers.filter((f) => !f.done);
    if (this.parts.length > 600) this.parts.splice(0, this.parts.length - 600);
  }

  draw(g, camX, camY) {
    for (const p of this.parts) {
      const a = 1 - Math.max(0, (p.t - p.life * 0.6) / (p.life * 0.4));
      g.globalAlpha = clamp(a, 0, 1);
      const x = Math.round(p.x - camX), y = Math.round(p.y - camY);
      g.fillStyle = p.c;
      if (p.kind === 'heart') this._pat(g, HEART_PX, x - 2, y - 2, p.c);
      else if (p.kind === 'note') this._pat(g, NOTE_PX, x - 2, y - 2, p.c);
      else if (p.kind === 'zzz') SPR.font.draw(g, 'z', x, y, p.c);
      else if (p.kind === 'sparkle') { g.fillRect(x, y - 1, 1, 3); g.fillRect(x - 1, y, 3, 1); }
      else if (p.kind === 'ripple') { const r = Math.round(2 + p.t * 8); g.fillRect(x - r, y, 2, 1); g.fillRect(x + r - 1, y, 2, 1); g.fillRect(x - 1, y - Math.round(r / 2), 2, 1); }
      else g.fillRect(x, y, p.size, p.size);
    }
    g.globalAlpha = 1;
    for (const f of this.flyers) {
      const k = clamp(f.t / f.life, 0, 1);
      const tx = f.target.x, ty = f.target.y - 18;
      const x = lerp(f.fx, tx, k), y = lerp(f.fy, ty, k) - Math.sin(k * Math.PI) * 18;
      g.drawImage(f.icon.img, Math.round(x - 8 - camX), Math.round(y - 8 - camY));
    }
    for (const t of this.texts) {
      const k = t.t / t.life;
      g.globalAlpha = clamp(1 - Math.max(0, (k - 0.65) / 0.35), 0, 1);
      const w = SPR.font.measure(t.str) + (t.icon ? 11 : 0);
      const x = Math.round(t.x - camX - w / 2), y = Math.round(t.y - camY - 12 - k * 14);
      if (t.icon) g.drawImage(t.icon.img, x - 4, y - 4, 16, 16);
      SPR.font.drawOutline(g, t.str, x + (t.icon ? 11 : 0), y, t.color, '#1d1a2b');
    }
    g.globalAlpha = 1;
  }

  _pat(g, rows, x, y, c) {
    g.fillStyle = c;
    for (let j = 0; j < rows.length; j++) for (let i = 0; i < rows[j].length; i++) if (rows[j][i] === '#') g.fillRect(x + i, y + j, 1, 1);
  }
}

// Height of a nest above ground and x offset, per tree kind
const NEST_OFF_TREE = { oak: [5, 24], birch: [3, 27], willow: [-6, 13], apple: [4, 18], pine: [3, 22], snag: [0, 26] };

// World position of a nest: x, ground y, height z
function nestAnchor(S, n) {
  const h = n.host ? S.objs.get(n.host) : null;
  if (!h) return { x: n.x * TS + 8, y: n.y * TS + 12, z: 0, sortY: n.y * TS + 12, ground: true };
  const bx = h.x * TS + 8, by = h.y * TS + 15;
  switch (h.type) {
    case 'tree': {
      const off = NEST_OFF_TREE[h.kind] || [4, 22];
      return { x: bx + off[0], y: by, z: off[1], sortY: by + 1, hole: h.kind === 'snag' };
    }
    case 'shrub': return { x: bx + 1, y: by, z: 7, sortY: by + 1 };
    case 'plant': return { x: bx, y: by, z: 9, sortY: by + 1 };
    case 'struct':
      if (h.kind === 'platform') return { x: bx, y: by, z: 46, sortY: by + 1 };
      if (h.kind === 'bank') return { x: bx + ((n.slot || 0) - 1) * 5, y: by, z: 6 + ((n.slot || 0) % 2) * 3, sortY: by + 1, hole: true };
      if (h.kind === 'brushpile') return { x: bx + 1, y: by, z: 6, sortY: by + 1 };
      return { x: bx, y: by, z: h.kind === 'owlbox' ? 30 : 22, sortY: by + 1, box: true };
    case 'building': {
      const b = BUILDINGS[h.kind], spr = SPR.building(h.kind, 0, false);
      const gy = (h.y + b.h) * TS;
      if (SPECIES_BY_ID[n.kind] && SPECIES_BY_ID[n.kind].site === 'chimney' && spr.chimneys && spr.chimneys.length) {
        const [cx, cy] = spr.chimneys[0];
        return { x: h.x * TS - spr.ax + cx, y: gy, z: gy - (h.y * TS - spr.ay + cy) - 3, sortY: gy + 1, eave: true };
      }
      const sl = (spr.eaves || [])[n.slot || 0] || [16, 20];
      return { x: h.x * TS + sl[0], y: gy, z: sl[1], sortY: gy + 1, eave: true };
    }
  }
  return { x: bx, y: by, z: 10, sortY: by + 1 };
}

const ACTIVE_NEST = { pair: 1, eggs: 1, chicks: 1, fledged: 1, lining: 1, cock: 1 };

class BirdAgent {
  constructor(sp, role) {
    this.sp = sp; this.role = role;
    this.x = 0; this.y = 0; this.z = 0; this.sortY = 0;
    this.state = 'idle';
    this.face = Math.random() < 0.5 ? 1 : -1;
    this.timer = 2000 + Math.random() * 4000;
    this.anim = 0; this.frame = 'perch';
    this.songT = 3000 + Math.random() * 12000;
    this.hidden = false;
    this.flight = null;
    this.perch = null;
    this.id = BirdAgent.seq++;
  }
}
BirdAgent.seq = 1;

class Birds {
  constructor(game) {
    this.game = game;
    this.agents = [];
    this.cands = new Map();
    this.candT = 0;
  }

  get S() { return this.game.state; }

  isNight() { const m = this.S.clock(); return m >= 20 * 60 + 30 || m < 5 * 60 + 40; }
  isDusk() { const m = this.S.clock(); return m >= 19 * 60; }

  reset() { this.agents = []; this.cands.clear(); this.rebuildVisitors(); this.syncNests(); }

  // ---------------------------------------------------------------- perch candidates
  zoneRect(zone) {
    if (zone === 'river') return [40, 0, 92, 58];
    return ZONES[zone] || ZONES.garden;
  }

  candidates(zone) {
    let c = this.cands.get(zone);
    if (c) return c;
    const S = this.S;
    const r = this.zoneRect(zone);
    c = { ground: [], shrub: [], tree: [], post: [], roof: [], water: [], thistle: [], trunk: [], reed: [], pine: [], waterperch: [], willow: [], air: [], shore: [] };
    const inZ = (x, y) => x >= r[0] - 1 && y >= r[1] - 1 && x <= r[2] + 1 && y <= r[3] + 1;
    const river = zone === 'river';
    for (const o of S.objs.values()) {
      if (!inZ(o.x, o.y)) continue;
      if (river && !nearWater(S, o.x, o.y, 3)) continue;
      const bx = o.x * TS + 8, by = o.y * TS + 15;
      const nearW = nearWater(S, o.x, o.y, 2);
      if (o.type === 'tree' && o.st >= 1) {
        const mature = o.st >= 2;
        const zz = mature ? (o.kind === 'oak' ? 30 : o.kind === 'pine' ? 30 : 24) : 14;
        const p = { kind: 'tree', x: bx, y: by, z: zz, sortY: by + 1, spread: mature ? 10 : 5, zs: mature ? 12 : 4 };
        if (o.kind !== 'snag') c.tree.push(p);
        if (o.kind === 'pine') c.pine.push(p);
        if (o.kind === 'willow') c.willow.push(p);
        c.trunk.push({ kind: 'trunk', x: bx, y: by, z: 8, sortY: by + 1, spread: 0, zs: 8, cling: true });
        if (nearW) c.waterperch.push(p);
      } else if (o.type === 'shrub' && o.st >= 1) {
        const p = { kind: 'shrub', x: bx, y: by, z: o.st >= 2 ? 14 : 8, sortY: by + 1, spread: 5, zs: 3 };
        c.shrub.push(p);
        if (nearW) c.waterperch.push(p);
      } else if (o.type === 'plant' && o.st >= 1) {
        if (o.kind === 'thistle') c.thistle.push({ kind: 'thistle', x: bx, y: by, z: 15, sortY: by + 1, spread: 2, zs: 1 });
        if (o.kind === 'reed' || o.kind === 'cattail') { const p = { kind: 'reed', x: bx, y: by, z: 13, sortY: by + 1, spread: 3, zs: 4 }; c.reed.push(p); c.waterperch.push(p); }
      } else if (o.type === 'fence' || (o.type === 'struct' && o.kind !== 'anvil' && o.kind !== 'birdbath')) {
        const z = o.type === 'fence' ? 11 : o.kind === 'platform' ? 50 : o.kind === 'owlbox' ? 40 : o.kind.startsWith('box') ? 28 : 10;
        const p = { kind: 'post', x: bx, y: by, z, sortY: by + 1, spread: 1, zs: 0 };
        c.post.push(p);
        if (nearW) c.waterperch.push(p);
      } else if (o.type === 'building' && o.kind !== 'bench' && o.kind !== 'mailbox' && o.kind !== 'well') {
        const b = BUILDINGS[o.kind];
        const roofZ = { cottage: 70, barn: 92, shop: 72, station: 70, coop: 40, farmhouse: 74, house1: 70, house2: 78 }[o.kind] || 40;
        for (let i = 1; i < b.w; i++) c.roof.push({ kind: 'roof', x: o.x * TS + i * TS, y: (o.y + b.h) * TS, z: roofZ, sortY: (o.y + b.h) * TS + 1, spread: 2, zs: 0 });
      }
    }
    // ground & water tiles (sampled)
    for (let k = 0; k < 400; k++) {
      const x = r[0] + Math.floor(Math.random() * (r[2] - r[0] + 1)), y = r[1] + Math.floor(Math.random() * (r[3] - r[1] + 1));
      if (!inBounds(x, y)) continue;
      const t = S.tiles[tIdx(x, y)];
      if (river && !nearWater(S, x, y, 2)) continue;
      const shore = (t === T.SHALLOW || ((t === T.SAND || t === T.GRAVEL || t === T.MUD) && nearWater(S, x, y, 1))) && !S.occ[tIdx(x, y)];
      if (shore && c.shore.length < 30) c.shore.push({ kind: 'ground', x: x * TS + 4 + Math.random() * 8, y: y * TS + 6 + Math.random() * 8, z: 0, sortY: y * TS + 10, spread: 3, zs: 0 });
      if (t === T.WATER || t === T.SHALLOW) { if (c.water.length < 30) c.water.push({ kind: 'water', x: x * TS + 8, y: y * TS + 10, z: 0, sortY: y * TS + 10, spread: 4, zs: 0 }); }
      else if (TINFO[t].land && !S.occ[tIdx(x, y)] && c.ground.length < 40) c.ground.push({ kind: 'ground', x: x * TS + 4 + Math.random() * 8, y: y * TS + 6 + Math.random() * 8, z: 0, sortY: y * TS + 10, spread: 3, zs: 0 });
    }
    const cx = (r[0] + r[2]) / 2 * TS, cy = (r[1] + r[3]) / 2 * TS;
    c.air.push({ kind: 'air', x: cx, y: cy, z: 40, sortY: cy, rx: Math.min(90, (r[2] - r[0]) * 5), ry: Math.min(60, (r[3] - r[1]) * 4) });
    this.cands.set(zone, c);
    return c;
  }

  pickPerch(sp, zone, near) {
    const prefs = BIRD_PREFS[sp] || { tree: 1 };
    const c = this.candidates(zone);
    let total = 0;
    for (const k in prefs) if (c[k] && c[k].length) total += prefs[k];
    let kind = null;
    if (total > 0) {
      let r = Math.random() * total;
      for (const k in prefs) { if (!c[k] || !c[k].length) continue; r -= prefs[k]; if (r <= 0) { kind = k; break; } }
    }
    if (!kind) kind = c.tree.length ? 'tree' : c.shrub.length ? 'shrub' : 'ground';
    let list = c[kind];
    if (!list || !list.length) list = c.ground.length ? c.ground : c.tree;
    if (!list.length) return null;
    let base = pick(list);
    if (near) {
      // prefer something close to a point
      let best = null, bd = 1e9;
      for (let i = 0; i < 8; i++) { const q = pick(list); const d = dist2(q.x, q.y, near.x, near.y); if (d < bd) { bd = d; best = q; } }
      base = best || base;
    }
    return this._jitter(base);
  }

  _jitter(b) {
    const p = Object.assign({}, b);
    if (b.kind !== 'air') {
      p.x = b.x + (Math.random() - 0.5) * 2 * (b.spread || 0);
      p.z = b.z + Math.random() * (b.zs || 0);
    }
    return p;
  }

  // ---------------------------------------------------------------- spawning
  rebuildVisitors() {
    this.cands.clear();
    this.agents = this.agents.filter((a) => a.role === 'parent' || a.role === 'family' || a.role === 'duckling');
    const S = this.S;
    const season = S.time.season;
    // common birds: small flocks of sparrows, starlings and magpies
    for (const sp of AMBIENT) {
      for (const zone of sp.zones) {
        const n = Math.max(1, Math.round(sp.flock * (0.6 + Math.random() * 0.6)));
        const base = this.pickPerch(sp.id, zone);
        if (!base) continue;
        for (let i = 0; i < n; i++) {
          const a = new BirdAgent(sp.id, 'ambient');
          a.zone = zone; a.ambient = true;
          const p = Object.assign({}, base);
          if (p.kind === 'ground') { p.x += (Math.random() - 0.5) * 30; p.y += (Math.random() - 0.5) * 20; p.sortY = p.y; }
          else p.x += (Math.random() - 0.5) * 10;
          if (!this._placeAt(a, p)) continue;
          a.flockId = sp.id + zone;
          this.agents.push(a);
        }
      }
    }
    for (const v of S.visitors || []) {
      const sp = SPECIES_BY_ID[v.sp];
      if (!sp || !sp.present.includes(season)) continue;
      const n = v.role === 'res' ? 2 : 1;
      for (let i = 0; i < n; i++) {
        const a = new BirdAgent(v.sp, v.role === 'lead' ? 'lead' : v.role);
        a.zone = sp.zone;
        if (!this._placeAt(a, this.pickPerch(v.sp, sp.zone))) continue;
        this.agents.push(a);
      }
    }
  }

  _placeAt(a, p) {
    if (!p) return false;
    a.perch = p;
    a.x = p.x; a.y = p.y; a.z = p.z; a.sortY = p.sortY;
    a.state = p.kind === 'air' ? 'circle' : p.kind === 'water' ? 'swim' : 'idle';
    if (a.state === 'circle') { a.ang = Math.random() * Math.PI * 2; a.cx = p.x; a.cy = p.y; a.rx = p.rx; a.ry = p.ry; a.circleT = 8000 + Math.random() * 12000; }
    return true;
  }

  syncNests() {
    const S = this.S;
    const active = new Map();
    for (const o of S.objs.values()) if (o.type === 'nest' && ACTIVE_NEST[o.st]) active.set(o.id, o);
    // drop agents of nests that ended
    this.agents = this.agents.filter((a) => !a.nest || active.has(a.nest));
    for (const n of active.values()) {
      const mine = this.agents.filter((a) => a.nest === n.id);
      const want = this._wantAgents(n);
      const sig = n.st + ':' + (n.ch || 0) + ':' + (n.cu || 0);
      if (mine.length === want.length && mine.every((a) => a.nestSig === sig)) continue;
      // respawn the nest's agents for the new stage
      this.agents = this.agents.filter((a) => a.nest !== n.id);
      const anc = nestAnchor(S, n);
      want.forEach((w, i) => {
        const a = new BirdAgent(w.sp, w.role);
        a.nest = n.id; a.nestSig = sig; a.job = w.job; a.zone = SPECIES_BY_ID[n.kind].zone;
        a.anchor = anc;
        if (w.job === 'sit') { a.state = 'sit'; a.x = anc.x; a.y = anc.y; a.z = anc.z; a.sortY = anc.sortY; a.hidden = !!(anc.box || anc.hole); }
        else if (w.job === 'duckling') {
          const water = this._nearestWater(anc.x, anc.y);
          a.state = 'swim'; a.x = water.x + (i + 1) * 6; a.y = water.y + 2; a.z = 0; a.sortY = a.y; a.follow = true;
        } else {
          const p = this._nearPerch(n, anc, i);
          a.x = p.x; a.y = p.y; a.z = p.z; a.sortY = p.sortY; a.perch = p; a.state = p.kind === 'water' ? 'swim' : 'idle';
          a.timer = 1500 + Math.random() * 5000;
        }
        this.agents.push(a);
      });
    }
    // link ducklings to their mother
    for (const a of this.agents) if (a.job === 'duckling') a.mother = this.agents.find((b) => b.nest === a.nest && b.job === 'mother');
  }

  _wantAgents(n) {
    const sp = n.kind;
    const out = [];
    switch (n.st) {
      case 'cock': out.push({ sp, role: 'parent', job: 'sing' }); break;
      case 'lining': out.push({ sp, role: 'parent', job: 'court' }, { sp, role: 'parent', job: 'court' }); break;
      case 'pair': out.push({ sp, role: 'parent', job: 'court' }, { sp, role: 'parent', job: 'court' }); break;
      case 'eggs': out.push({ sp, role: 'parent', job: 'sit' }, { sp, role: 'parent', job: 'guard' }); break;
      case 'chicks':
        if (sp === 'mallard') {
          out.push({ sp, role: 'parent', job: 'mother' });
          for (let i = 0; i < Math.min(6, n.ch || 4); i++) out.push({ sp, role: 'duckling', job: 'duckling' });
        } else { out.push({ sp, role: 'parent', job: 'feed' }, { sp, role: 'parent', job: 'feed' }); }
        break;
      case 'fledged': {
        const kid = n.cu ? 'cuckoo' : sp;
        out.push({ sp, role: 'family', job: 'family' }, { sp, role: 'family', job: 'family' });
        for (let i = 0; i < Math.min(3, n.cu ? 1 : (n.ch || 3)); i++) out.push({ sp: kid, role: 'family', job: 'family' });
        break;
      }
    }
    return out;
  }

  _nearPerch(n, anc, i) {
    const sp = SPECIES_BY_ID[n.kind];
    const p = this.pickPerch(n.kind, sp.zone, anc);
    if (p && dist2(p.x, p.y, anc.x, anc.y) < 140 * 140) return p;
    // fall back to perching right next to the nest
    return { kind: 'post', x: anc.x + (i ? 8 : -8), y: anc.y, z: anc.z + 2, sortY: anc.sortY, spread: 0, zs: 0 };
  }

  _nearestWater(x, y) {
    const S = this.S;
    const tx = Math.floor(x / TS), ty = Math.floor(y / TS);
    for (let r = 0; r < 8; r++) for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
      if (isWaterT(tileAt(S, tx + dx, ty + dy))) return { x: (tx + dx) * TS + 8, y: (ty + dy) * TS + 8 };
    }
    return { x, y };
  }

  // ---------------------------------------------------------------- behaviour
  flyTo(a, p, speed) {
    if (!p) return;
    const d = Math.hypot(p.x - a.x, p.y - a.y) + Math.abs(p.z - a.z) * 0.5;
    a.flight = { x0: a.x, y0: a.y, z0: a.z, p, t: 0, dur: Math.max(400, d / (speed || 70) * 1000), arc: Math.min(30, 8 + d * 0.12) };
    a.state = 'fly';
    a.hidden = false;
    a.face = p.x >= a.x ? 1 : -1;
  }

  update(dt) {
    const S = this.S;
    if (!S || !S.time) return;
    const night = this.isNight();
    const me = this.game.me;
    const m = S.clock();
    const chorus = m < 9 * 60 ? 2.5 : m > 18 * 60 ? 1.4 : 0.6;
    this.candT += dt;
    if (this.candT > 30000) { this.candT = 0; this.cands.clear(); }
    for (const a of this.agents) {
      const sp = SPECIES_BY_ID[a.sp];
      const nocturnal = !!sp.night;
      const asleep = nocturnal ? !this.isDusk() && !night : night;
      a.anim += dt;
      // ---- night: diurnal visitors roost (hidden); owls only come out at dusk
      if (!a.nest) {
        if (asleep && a.state !== 'fly') { a.hidden = true; continue; }
        if (!asleep && a.hidden && a.state !== 'sit') a.hidden = false;
      }
      // ---- flee from people moving close by
      if (a.state === 'idle' || a.state === 'swim') {
        for (const p of S.players.values()) {
          if (p.sleep) continue;
          const close = dist2(p.x, p.y, a.x, a.y) < (p.m ? 26 * 26 : 12 * 12);
          if (close && !a.observed && a.job !== 'sit') {
            const np = a.nest ? this._nearPerch(S.objs.get(a.nest) || { kind: a.sp }, a.anchor, 0) : this.pickPerch(a.sp, a.zone);
            this.flyTo(a, np, 95);
            Audio2.sfx('rustle', a.x, a.y);
            // the rest of the flock follows
            if (a.flockId && np) for (const b of this.agents) {
              if (b === a || b.flockId !== a.flockId || b.state === 'fly' || b.observed) continue;
              if (dist2(b.x, b.y, a.x, a.y) > 60 * 60) continue;
              const q = Object.assign({}, np, { x: np.x + (Math.random() - 0.5) * 24, y: np.y + (np.kind === 'ground' ? (Math.random() - 0.5) * 16 : 0) });
              q.sortY = np.kind === 'ground' ? q.y : np.sortY;
              this.flyTo(b, q, 90 + Math.random() * 20);
            }
            break;
          }
        }
      }
      // ---- songs
      if (!asleep && (a.state === 'idle' || a.state === 'circle' || a.state === 'swim' || a.job === 'sing')) {
        a.songT -= dt * (a.job === 'sing' || a.job === 'court' ? 2 : chorus) * (S.weather === 'rain' ? 0.4 : 1);
        if (a.songT <= 0) {
          a.songT = 9000 + Math.random() * 16000;
          if (me && dist2(me.x, me.y, a.x, a.y) < 280 * 280) {
            Audio2.song(a.sp, a.x, a.y - a.z);
            this.game.fx.burst('note', a.x + a.face * 4, a.y - a.z - 10, 1);
          }
        }
      }
      switch (a.state) {
        case 'fly': {
          const f = a.flight;
          f.t += dt;
          const k = clamp(f.t / f.dur, 0, 1);
          const e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
          a.x = lerp(f.x0, f.p.x, e); a.y = lerp(f.y0, f.p.y, e);
          a.z = lerp(f.z0, f.p.z, e) + Math.sin(k * Math.PI) * f.arc;
          a.sortY = a.y;
          if (k >= 1) {
            a.perch = f.p; a.flight = null;
            a.sortY = f.p.sortY;
            a.state = f.p.kind === 'water' ? 'swim' : f.p.kind === 'air' ? 'circle' : 'idle';
            if (a.state === 'circle') { a.ang = Math.random() * 6.3; a.cx = f.p.x; a.cy = f.p.y; a.rx = f.p.rx; a.ry = f.p.ry; a.circleT = 8000 + Math.random() * 10000; }
            a.timer = 3000 + Math.random() * 8000;
            if (a.onLand) { const fn = a.onLand; a.onLand = null; fn(); }
          }
          break;
        }
        case 'circle': {
          const spd = a.sp === 'barnowl' ? 0.35 : 0.9;
          a.ang += dt / 1000 * spd;
          a.x = a.cx + Math.cos(a.ang) * a.rx; a.y = a.cy + Math.sin(a.ang) * a.ry;
          a.z = 34 + Math.sin(a.ang * 3) * 8;
          a.face = -Math.sin(a.ang) >= 0 ? 1 : -1;
          a.sortY = a.y;
          a.circleT -= dt;
          if (a.circleT <= 0) {
            const p = this.pickPerch(a.sp, a.zone);
            if (p && p.kind !== 'air') this.flyTo(a, p, 110); else a.circleT = 6000;
          }
          break;
        }
        case 'swim': {
          if (a.follow && a.mother) {
            const idx = this.agents.filter((b) => b.mother === a.mother).indexOf(a);
            const tx = a.mother.x - a.mother.face * (8 + idx * 6), ty = a.mother.y + 1;
            a.x = lerp(a.x, tx, 0.04); a.y = lerp(a.y, ty, 0.04); a.face = a.mother.face; a.sortY = a.y;
            break;
          }
          a.timer -= dt;
          if (!a.swimTo || a.timer < 0) {
            const S2 = this.S;
            const nx = a.x + (Math.random() - 0.5) * 40, ny = a.y + (Math.random() - 0.5) * 30;
            if (isWaterT(tileAt(S2, Math.floor(nx / TS), Math.floor(ny / TS)))) a.swimTo = { x: nx, y: ny };
            a.timer = 2000 + Math.random() * 4000;
          }
          if (a.swimTo) {
            const dx = a.swimTo.x - a.x, dy = a.swimTo.y - a.y, d = Math.hypot(dx, dy);
            if (d > 1) { a.x += dx / d * 0.012 * dt; a.y += dy / d * 0.012 * dt; a.face = dx >= 0 ? 1 : -1; }
            a.sortY = a.y;
          }
          a.frame = (a.anim % 4000) < 600 ? 'peck' : 'perch';
          break;
        }
        case 'sit': {
          a.timer -= dt;
          break;
        }
        case 'idle': {
          a.timer -= dt;
          const ground = a.perch && a.perch.kind === 'ground';
          // idle animation: pecking on the ground, occasional turn
          if (ground) a.frame = (a.anim % 1800) < 350 ? 'peck' : 'perch';
          else a.frame = (a.anim % 5000) < 200 ? 'peck' : 'perch';
          if (a.perch && a.perch.cling) a.frame = (a.anim % 900) < 120 ? 'peck' : 'perch';
          if (Math.random() < dt / 6000) a.face = -a.face;
          if (ground && Math.random() < dt / 2500) {
            // hop
            const nx = a.x + a.face * (3 + Math.random() * 6);
            const t2 = tileAt(S, Math.floor(nx / TS), Math.floor(a.y / TS));
            if (TINFO[t2].land) { a.x = nx; a.hopT = 160; }
          }
          if (a.hopT > 0) a.hopT -= dt;
          if (a.timer <= 0 && !a.observed) this._nextMove(a);
          break;
        }
      }
    }
  }

  _nextMove(a) {
    const S = this.S;
    if (a.ambient) {
      // ground flocks shuffle around a little; sometimes the whole flock moves on
      if (a.perch && a.perch.kind === 'ground' && Math.random() < 0.7) {
        const p = Object.assign({}, a.perch, { x: a.x + (Math.random() - 0.5) * 30, y: a.y + (Math.random() - 0.5) * 20 });
        if (TINFO[tileAt(S, Math.floor(p.x / TS), Math.floor(p.y / TS))].land) { p.sortY = p.y; this.flyTo(a, p, 50); return; }
      }
      a.timer = 4000 + Math.random() * 6000;
      return;
    }
    if (!a.nest) { this.flyTo(a, this.pickPerch(a.sp, a.zone), 70); return; }
    const n = S.objs.get(a.nest);
    if (!n) return;
    const anc = a.anchor = nestAnchor(S, n);
    switch (a.job) {
      case 'feed': {
        if (a.atNest) {
          a.atNest = false;
          const p = this._nearPerch(n, anc, 0);
          p.kind = p.kind === 'water' ? 'ground' : p.kind;
          this.flyTo(a, p, 90);
        } else {
          this.flyTo(a, { kind: 'nest', x: anc.x + (Math.random() < 0.5 ? -3 : 3), y: anc.y, z: anc.z + 2, sortY: anc.sortY + 0.5 }, 90);
          a.onLand = () => {
            a.atNest = true; a.timer = 1200 + Math.random() * 1500;
            if (anc.box || anc.hole) a.hidden = true;
            Audio2.sfx('chirps', anc.x, anc.y - anc.z);
            this.game.beg(n.id);
          };
          return;
        }
        a.timer = 2500 + Math.random() * 4000;
        break;
      }
      case 'guard': case 'court': case 'sing': case 'family': {
        const p = Math.random() < 0.5 ? this._nearPerch(n, anc, Math.random() < 0.5 ? 0 : 1) : this.pickPerch(a.sp, a.zone, anc);
        if (p) this.flyTo(a, p, 75);
        if (a.job === 'court' && Math.random() < 0.5) this.game.fx.burst('heart', anc.x, anc.y - anc.z - 6, 1);
        break;
      }
      case 'mother': {
        const w = this._nearestWater(anc.x, anc.y);
        a.state = 'swim'; a.swimTo = { x: w.x + (Math.random() - 0.5) * 30, y: w.y + (Math.random() - 0.5) * 20 };
        break;
      }
      default: this.flyTo(a, this.pickPerch(a.sp, a.zone, anc), 70);
    }
  }

  // Visible birds a player could observe near (x, y)
  observable(x, y, r) {
    let best = null, bd = r * r;
    for (const a of this.agents) {
      if (a.hidden || a.state === 'fly') continue;
      if (a.role === 'duckling') continue;
      const d = dist2(a.x, a.y - a.z * 0.5, x, y);
      if (d < bd) { bd = d; best = a; }
    }
    return best;
  }

  sprite(a) {
    const s = SPR.bird(a.sp);
    let f = a.state === 'fly' || a.state === 'circle' ? ((a.anim % 260) < 130 ? 'fly1' : 'fly2') : a.frame || 'perch';
    if (a.sp === 'barnowl' && (a.state === 'fly' || a.state === 'circle')) f = (a.anim % 700) < 350 ? 'fly1' : 'fly2';
    if (a.hopT > 0) f = 'hop';
    return { s, img: a.face < 0 ? s[f + '_L'] : s[f], fly: f.startsWith('fly') };
  }
}

// ---- js/client/render.js ----
// World renderer: terrain chunks, y-sorted sprites, birds, effects, weather and lighting.

const CHUNK = 16;

class Renderer {
  constructor(game) {
    this.game = game;
    this.chunks = new Map();
    this.jobs = new Map();
    this.season = -1;
    this.lightCv = document.createElement('canvas');
    this.lightG = this.lightCv.getContext('2d');
    this.glow = this._makeGlow();
    this.stamp = 0;
    this.rain = [];
    this.fireflies = [];
    this.smokeT = 0;
    this.smokeI = 0;
    this._chimneys = [];
    this.leafT = 0;
  }

  _makeGlow() {
    const cv = document.createElement('canvas');
    cv.width = cv.height = 64;
    const g = cv.getContext('2d');
    const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, 'rgba(255,236,180,1)');
    gr.addColorStop(0.45, 'rgba(255,210,140,0.55)');
    gr.addColorStop(1, 'rgba(255,200,120,0)');
    g.fillStyle = gr;
    g.fillRect(0, 0, 64, 64);
    return cv;
  }

  invalidateAll() { this.chunks.clear(); this.jobs.clear(); SPR.tiles.depth = null; }

  // Build terrain chunks near the camera in the background, a few milliseconds per frame,
  // so walking into new areas never stalls.
  prewarm(S, cam, view, budget) {
    if (!S || !S.tiles) return;
    const season = S.time.season;
    if (season !== this.season) return;
    const t0 = performance.now();
    const ccx = Math.floor((cam.x + view.w / 2) / (CHUNK * TS)), ccy = Math.floor((cam.y + view.h / 2) / (CHUNK * TS));
    const nx = Math.ceil(MAP_W / CHUNK), ny = Math.ceil(MAP_H / CHUNK);
    while (performance.now() - t0 < (budget || 5)) {
      let best = null, bd = 1e9;
      for (let cy = 0; cy < ny; cy++) for (let cx = 0; cx < nx; cx++) {
        if (this.chunks.has(cx + ',' + cy)) continue;
        const d = (cx - ccx) ** 2 + (cy - ccy) ** 2;
        if (d < bd) { bd = d; best = [cx, cy]; }
      }
      if (!best) return;
      const key = best[0] + ',' + best[1];
      let job = this.jobs.get(key);
      if (!job) { job = SPR.tiles.chunkJob(S.tiles, best[0], best[1], CHUNK, season); this.jobs.set(key, job); }
      while (performance.now() - t0 < (budget || 5)) {
        const r = job.next();
        if (r.done) { this.chunks.set(key, r.value.canvas()); this.jobs.delete(key); break; }
      }
    }
  }

  _chunk(S, cx, cy, season) {
    const key = cx + ',' + cy;
    let c = this.chunks.get(key);
    if (!c) {
      let job = this.jobs.get(key);
      if (!job) job = SPR.tiles.chunkJob(S.tiles, cx, cy, CHUNK, season);
      let r;
      while (!(r = job.next()).done) { /* finish now */ }
      this.jobs.delete(key);
      c = r.value.canvas();
      this.chunks.set(key, c);
    }
    return c;
  }

  _processDirty(S) {
    if (S.allDirty || S.time.season !== this.season) {
      this.chunks.clear();
      this.jobs.clear();
      SPR.tiles.depth = null;
      this.season = S.time.season;
      S.allDirty = false;
      S.dirtyTiles.clear();
      return;
    }
    if (!S.dirtyTiles.size) return;
    // Patch only the tiles that look different: the changed tiles, their neighbours (fringes)
    // and any water whose depth shading moved. Unfinished chunk jobs simply restart.
    const oldDepth = SPR.tiles.depth;
    const depth = SPR.tiles.depth = computeWaterDepth(S.tiles);
    const redo = new Set();
    const around = (i) => {
      const x = i % MAP_W, y = Math.floor(i / MAP_W);
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        const nx = x + dx, ny = y + dy;
        if (nx >= 0 && ny >= 0 && nx < MAP_W && ny < MAP_H) redo.add(ny * MAP_W + nx);
      }
    };
    for (const i of S.dirtyTiles) around(i);
    if (oldDepth) for (let i = 0; i < depth.length; i++) if (depth[i] !== oldDepth[i]) around(i);
    S.dirtyTiles.clear();
    for (const i of redo) {
      const x = i % MAP_W, y = Math.floor(i / MAP_W);
      const key = Math.floor(x / CHUNK) + ',' + Math.floor(y / CHUNK);
      this.jobs.delete(key);
      const c = this.chunks.get(key);
      if (!c) continue;
      const px = SPR.tiles.renderTile(S.tiles, x, y, this.season);
      c.getContext('2d').drawImage(px.canvas(), (x % CHUNK) * TS, (y % CHUNK) * TS);
    }
  }

  // ---------------------------------------------------------------- main draw
  draw(g, view, cam, now) {
    const game = this.game, S = game.state;
    const season = S.time.season;
    this._processDirty(S);
    this._chimneys = [];
    const cx0 = Math.floor(cam.x), cy0 = Math.floor(cam.y);
    g.fillStyle = '#2a4a2a';
    g.fillRect(0, 0, view.w, view.h);
    // terrain
    const ch0x = Math.floor(cx0 / (CHUNK * TS)), ch1x = Math.floor((cx0 + view.w) / (CHUNK * TS));
    const ch0y = Math.floor(cy0 / (CHUNK * TS)), ch1y = Math.floor((cy0 + view.h) / (CHUNK * TS));
    for (let cy = ch0y; cy <= ch1y; cy++) for (let cx = ch0x; cx <= ch1x; cx++) {
      if (cx < 0 || cy < 0 || cx * CHUNK >= MAP_W || cy * CHUNK >= MAP_H) continue;
      g.drawImage(this._chunk(S, cx, cy, season), cx * CHUNK * TS - cx0, cy * CHUNK * TS - cy0);
    }
    const tx0 = Math.max(0, Math.floor(cx0 / TS) - 1), tx1 = Math.min(MAP_W - 1, Math.floor((cx0 + view.w) / TS) + 1);
    const ty0 = Math.max(0, Math.floor(cy0 / TS) - 1), ty1 = Math.min(MAP_H - 1, Math.floor((cy0 + view.h) / TS) + 6);
    // moving water: drifting wave highlights and sun glints
    const sunny = S.weather === 'sun' && S.clock() < 19 * 60;
    for (let ty = ty0; ty <= ty1; ty++) for (let tx = tx0; tx <= tx1; tx++) {
      const t = S.tiles[tIdx(tx, ty)];
      if (t !== T.WATER && t !== T.SHALLOW) continue;
      for (let k = 0; k < 2; k++) {
        const hh = hash32(tx, ty, 11 + k);
        if (hh % 5 === 0) continue;
        const period = 2400 + (hh % 1900);
        const ph = ((now + (hh >>> 4) % period) % period) / period;
        const a = Math.sin(ph * Math.PI);
        if (a < 0.15) continue;
        const len = 2 + ((hh >>> 16) % 3) + (t === T.WATER ? 1 : 0);
        const x = tx * TS + ((hh >>> 8) % 11) + Math.round(Math.sin(ph * 6.283) * 2) - cx0;
        const y = ty * TS + 2 + ((hh >>> 12) % 12) - cy0;
        g.fillStyle = season === WINTER ? 'rgba(255,255,255,' + (a * 0.6).toFixed(2) + ')' : 'rgba(214,244,255,' + (a * 0.55).toFixed(2) + ')';
        g.fillRect(x, y, len, 1);
        if (len > 3) { g.fillStyle = 'rgba(40,80,120,' + (a * 0.25).toFixed(2) + ')'; g.fillRect(x + 1, y + 1, len - 2, 1); }
      }
      if (sunny) {
        const hs = hash32(tx, ty, 29);
        const ph = ((now / 180) + (hs % 97)) % 24;
        if (ph < 2) {
          const sx = tx * TS + 2 + (hs >>> 8) % 12 - cx0, sy = ty * TS + 2 + (hs >>> 16) % 12 - cy0;
          g.fillStyle = '#ffffff';
          g.fillRect(sx, sy, 1, 1);
          if (ph < 1) { g.fillRect(sx - 1, sy, 3, 1); g.fillRect(sx, sy - 1, 1, 3); }
        }
      }
    }
    // ground layer: puddles, medium grass, forage, dug spots
    const tufts = SPR.tufts(season);
    const stamp = ++this.stamp;
    const sorted = [];
    for (let ty = ty0; ty <= ty1; ty++) for (let tx = tx0; tx <= tx1; tx++) {
      const i = tIdx(tx, ty);
      const gh = S.grass[i];
      if (gh === 1 && !S.occ[i]) g.drawImage(tufts.mid[(tx * 3 + ty) % 3], tx * TS - cx0, ty * TS + 6 - cy0);
      else if (gh === 2 && !S.occ[i]) {
        const hh = hash32(tx, ty, 61);
        const fr = ((Math.floor((now + (hh & 1023)) / 900) + tx + ty) % 2) * 3 + (hh >>> 10) % 3;
        const jx = ((hh >>> 4) % 7) - 3, jy = ((hh >>> 7) % 5) - 2;
        sorted.push({ y: ty * TS + 15 + jy, img: tufts.long[fr % 6], x: tx * TS - 1 + jx, yy: ty * TS - 4 + jy });
      }
      const arr = S.byTile.get(i);
      if (!arr) continue;
      for (const id of arr) {
