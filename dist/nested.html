// ---- js/core/util.js ----
// Shared helpers: math, seeded randomness, noise, encoding, formatting.
// All game scripts are classic scripts sharing one global scope (so the game
// also runs straight from file:// without a server).

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const dist2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };
const sign = (v) => (v < 0 ? -1 : v > 0 ? 1 : 0);

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function hash32(a, b, c) {
  let h = (Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263) + Math.imul(c | 0, 2147483647)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return h >>> 0;
}
const hashf = (x, y, s) => hash32(x, y, s || 0) / 4294967296;

function strHash(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}

function smoothstep(t) { return t * t * (3 - 2 * t); }

function valueNoise(x, y, seed) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const a = hashf(xi, yi, seed), b = hashf(xi + 1, yi, seed);
  const c = hashf(xi, yi + 1, seed), d = hashf(xi + 1, yi + 1, seed);
  const u = smoothstep(xf), v = smoothstep(yf);
  return lerp(lerp(a, b, u), lerp(c, d, u), v);
}

function fbm(x, y, seed, oct) {
  let sum = 0, amp = 0.5, f = 1, norm = 0;
  for (let i = 0; i < (oct || 3); i++) {
    sum += amp * valueNoise(x * f, y * f, seed + i * 101);
    norm += amp; amp *= 0.5; f *= 2;
  }
  return sum / norm;
}

function shuffle(arr, rnd) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}
const pick = (arr, rnd) => arr[Math.floor((rnd ? rnd() : Math.random()) * arr.length)];
const randInt = (rnd, a, b) => a + Math.floor(rnd() * (b - a + 1));

function b64encode(u8) {
  let s = '';
  for (let i = 0; i < u8.length; i += 8192) s += String.fromCharCode.apply(null, u8.subarray(i, i + 8192));
  return btoa(s);
}
function b64decode(str) {
  const s = atob(str);
  const u8 = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) u8[i] = s.charCodeAt(i);
  return u8;
}

const deepClone = (o) => JSON.parse(JSON.stringify(o));

function makeToken() {
  const chars = 'abcdefghijkmnopqrstuvwxyz23456789';
  let s = '';
  for (let i = 0; i < 16; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return s;
}

function fmtClock(min) {
  let m = Math.floor(min) % 1440;
  let h = Math.floor(m / 60), mm = Math.floor(m % 60 / 10) * 10;
  const am = h < 12;
  let hh = h % 12; if (hh === 0) hh = 12;
  return hh + ':' + (mm < 10 ? '0' : '') + mm + (am ? ' am' : ' pm');
}

function plural(n, word, pl) { return n + ' ' + (n === 1 ? word : (pl || word + 's')); }

// Word-wrap text for a monospace-ish measure function.
function wrapText(text, maxW, measure) {
  const out = [];
  for (const para of String(text).split('\n')) {
    const words = para.split(' ');
    let line = '';
    for (const w of words) {
      const test = line ? line + ' ' + w : w;
      if (measure(test) <= maxW || !line) line = test;
      else { out.push(line); line = w; }
    }
    out.push(line);
  }
  return out;
}

// ---- js/sim/rules.js ----
// Pure rule queries shared by the authoritative World (host) and the client mirror.
// A "state" S has: tiles, grass, objs (Map), occ (Int32Array), byTile (Map), time, journal, mats, coins.

const tIdx = (x, y) => y * MAP_W + x;
const inBounds = (x, y) => x >= 0 && y >= 0 && x < MAP_W && y < MAP_H;
const dayIdx = (time) => (time.year - 1) * 28 + time.season * 7 + (time.day - 1);
const dateStr = (time) => SEASON_NAMES[time.season] + ' ' + time.day + ', Year ' + time.year;

const BUILDINGS = {
  cottage: { name: 'Your Cottage', w: 5, h: 3, door: [2, 2], site: 'eaves', chimney: true },
  barn:    { name: 'Mabel\'s Barn', w: 6, h: 4, door: [2, 3], site: 'barn' },
  shop:    { name: 'Basil\'s Garden Shop', w: 6, h: 3, door: [2, 2], site: 'eaves' },
  station: { name: 'Field Station', w: 6, h: 3, door: [2, 2], site: 'eaves' },
  farmhouse: { name: 'Mabel\'s Farmhouse', w: 5, h: 3, door: [2, 2], site: 'eaves', chimney: true,
    knock: 'Mabel\'s farmhouse. It smells of fresh bread and woodsmoke — Mabel must be out with the animals.' },
  house1:  { name: 'Rose Cottage', w: 5, h: 3, door: [2, 2], site: 'eaves', chimney: true,
    knock: 'A note on the door: "Gone to the coast to watch the puffins. Back next week! — the Hartleys"' },
  house2:  { name: 'Willow House', w: 5, h: 3, door: [2, 2], site: 'eaves', chimney: true,
    knock: 'Nobody answers. Through the window, a tabby cat is asleep on a pile of bird books.' },
  coop:    { name: 'Chicken Coop', w: 3, h: 2 },
  bench:   { name: 'Workbench', w: 2, h: 1 },
  mailbox: { name: 'Mailbox', w: 1, h: 1 },
  well:    { name: 'Well', w: 1, h: 1 },
};

function footprint(o) {
  if (o.type === 'building') { const b = BUILDINGS[o.kind]; return [b.w, b.h]; }
  if (o.type === 'landmark') { const l = LANDMARKS[o.kind]; return [l.w || 1, l.h || 1]; }
  if (o.type === 'log') return [2, 1];
  return [1, 1];
}

const OCCUPYING = { tree: 1, shrub: 1, plant: 1, rock: 1, log: 1, stump: 1, struct: 1, building: 1, fence: 1, landmark: 1 };
function occupies(o) { return !!OCCUPYING[o.type] || (o.type === 'nest' && !o.host); }

// Solid collision box in px relative to the object's top-left tile, or null.
function solidBox(o) {
  switch (o.type) {
    case 'tree': return o.st >= 1 ? [4, 9, 12, 15] : null;
    case 'shrub': return o.st >= 1 ? [2, 7, 14, 15] : null;
    case 'rock': return o.kind === 'boulder' ? [1, 5, 15, 15] : [2, 7, 14, 15];
    case 'log': return [1, 7, 31, 14];
    case 'stump': return [3, 8, 13, 15];
    case 'fence': return [0, 9, 16, 13];
    case 'building': { const [w, h] = footprint(o); return [0, 2, w * TS, h * TS - 1]; }
    case 'landmark': return LANDMARKS[o.kind].solid;
    case 'struct':
      if (o.kind === 'anvil') return null;
      if (o.kind === 'bank' || o.kind === 'brushpile') return [1, 5, 15, 15];
      if (o.kind === 'birdbath') return [3, 8, 13, 15];
      return [6, 11, 10, 15];
    default: return null;
  }
}

function idxAdd(S, o) {
  S.objs.set(o.id, o);
  const [w, h] = footprint(o);
  const occ = occupies(o);
  for (let dy = 0; dy < h; dy++) for (let dx = 0; dx < w; dx++) {
    const x = o.x + dx, y = o.y + dy;
    if (!inBounds(x, y)) continue;
    const i = tIdx(x, y);
    let arr = S.byTile.get(i);
    if (!arr) { arr = []; S.byTile.set(i, arr); }
    arr.push(o.id);
    if (occ) S.occ[i] = o.id;
  }
}

function idxRemove(S, o) {
  S.objs.delete(o.id);
  const [w, h] = footprint(o);
  for (let dy = 0; dy < h; dy++) for (let dx = 0; dx < w; dx++) {
    const x = o.x + dx, y = o.y + dy;
    if (!inBounds(x, y)) continue;
    const i = tIdx(x, y);
    const arr = S.byTile.get(i);
    if (arr) {
      const k = arr.indexOf(o.id);
      if (k >= 0) arr.splice(k, 1);
      if (!arr.length) S.byTile.delete(i);
    }
    if (S.occ[i] === o.id) S.occ[i] = 0;
  }
}

function objAt(S, x, y) {
  if (!inBounds(x, y)) return null;
  const id = S.occ[tIdx(x, y)];
  return id ? S.objs.get(id) || null : null;
}

function objsOnTile(S, x, y) {
  if (!inBounds(x, y)) return [];
  const arr = S.byTile.get(tIdx(x, y));
  if (!arr) return [];
  const out = [];
  for (const id of arr) { const o = S.objs.get(id); if (o) out.push(o); }
  return out;
}

function tileAt(S, x, y) { return inBounds(x, y) ? S.tiles[tIdx(x, y)] : T.CLIFF; }

// ---------- collision ----------
function boxBlocked(S, x0, y0, x1, y1) {
  if (x0 < 2 || y0 < 2 || x1 > MAP_W * TS - 2 || y1 > MAP_H * TS - 2) return true;
  const tx0 = Math.floor(x0 / TS), tx1 = Math.floor((x1 - 0.001) / TS);
  const ty0 = Math.floor(y0 / TS), ty1 = Math.floor((y1 - 0.001) / TS);
  for (let ty = ty0; ty <= ty1; ty++) for (let tx = tx0; tx <= tx1; tx++) {
    if (!inBounds(tx, ty)) return true;
    if (TINFO[S.tiles[tIdx(tx, ty)]].solid) return true;
    const id = S.occ[tIdx(tx, ty)];
    if (!id) continue;
    const o = S.objs.get(id);
    if (!o) continue;
    const b = solidBox(o);
    if (!b) continue;
    const bx0 = o.x * TS + b[0], by0 = o.y * TS + b[1], bx1 = o.x * TS + b[2], by1 = o.y * TS + b[3];
    if (x1 > bx0 && x0 < bx1 && y1 > by0 && y0 < by1) return true;
  }
  return false;
}

const FEET = [5, 4, 5, 1]; // left, up, right, down extents of the feet box
function feetBlocked(S, px, py) { return boxBlocked(S, px - FEET[0], py - FEET[1], px + FEET[2], py + FEET[3]); }

// Move with axis separation and gentle corner sliding. Returns [x, y].
function moveActor(S, x, y, dx, dy) {
  if (dx) {
    if (!feetBlocked(S, x + dx, y)) x += dx;
    else if (!dy) {
      for (const n of [1, -1, 2, -2, 3, -3, 4, -4]) {
        if (!feetBlocked(S, x, y + n) && !feetBlocked(S, x + dx, y + n)) { y += sign(n) * Math.min(1, Math.abs(n)); break; }
      }
    }
  }
  if (dy) {
    if (!feetBlocked(S, x, y + dy)) y += dy;
    else if (!dx) {
      for (const n of [1, -1, 2, -2, 3, -3, 4, -4]) {
        if (!feetBlocked(S, x + n, y) && !feetBlocked(S, x + n, y + dy)) { x += sign(n) * Math.min(1, Math.abs(n)); break; }
      }
    }
  }
  return [x, y];
}

function speedAt(S, px, py) {
  const t = tileAt(S, Math.floor(px / TS), Math.floor(py / TS));
  return TINFO[t].speed || 1;
}

// ---------- habitat ----------
function isTreeLive(o) { return o.type === 'tree' && o.kind !== 'snag' && o.st >= 1; }

function countHab(S, kind, cx, cy, r) {
  let n = 0;
  const seen = new Set();
  const r2 = r * r + 0.5;
  for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
    if (dx * dx + dy * dy > r2) continue;
    const x = cx + dx, y = cy + dy;
    if (!inBounds(x, y)) continue;
    const i = tIdx(x, y), t = S.tiles[i];
    switch (kind) {
      case 'lawn': if (t === T.GRASS && S.grass[i] === 0 && !S.occ[i]) n++; continue;
      case 'longgrass': if ((t === T.GRASS || t === T.MARSH) && S.grass[i] === 2) n++; continue;
      case 'water': case 'waterbody': if (t === T.WATER || t === T.SHALLOW) n++; break;
      case 'mud': if (t === T.MUD) n++; break;
      case 'cover': if ((t === T.GRASS || t === T.MARSH) && S.grass[i] === 2) n++; break;
      case 'rock': if (t === T.ROCK || t === T.CLIFF) n++; continue;
    }
    const arr = S.byTile.get(i);
    if (!arr) continue;
    for (const id of arr) {
      if (seen.has(id)) continue;
      seen.add(id);
      const o = S.objs.get(id);
      if (!o) continue;
      switch (kind) {
        case 'trees': case 'open': if (isTreeLive(o)) n++; break;
        case 'pines': if (o.type === 'tree' && o.kind === 'pine' && o.st >= 1) n++; break;
        case 'oaks': if (o.type === 'tree' && o.kind === 'oak' && o.st >= 1) n++; break;
        case 'shrubs': if (o.type === 'shrub' && o.st >= 1) n++; break;
        case 'reeds': if (o.type === 'plant' && (o.kind === 'reed' || o.kind === 'cattail') && o.st >= 1) n++; break;
        case 'cover': if (o.type === 'plant' && (o.kind === 'reed' || o.kind === 'cattail') && o.st >= 1) n++; break;
        case 'thistles': if (o.type === 'plant' && o.kind === 'thistle' && o.st >= 1) n++; break;
        case 'flowers': if (o.type === 'plant' && FLORA[o.kind].flower && o.st >= 1) n++; break;
        case 'deadwood':
          if (o.type === 'log' || o.type === 'stump' || (o.type === 'tree' && o.kind === 'snag') ||
              (o.type === 'struct' && o.kind === 'brushpile')) n++;
          break;
        case 'anvil': if (o.type === 'struct' && o.kind === 'anvil') n++; break;
        case 'water': if (o.type === 'struct' && o.kind === 'birdbath' && r <= 6) n++; break;
        case 'mud': if (o.type === 'puddle') n++; break;
      }
    }
  }
  return n;
}

function nearWater(S, x, y, r) {
  for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
    if (isWaterT(tileAt(S, x + dx, y + dy))) return true;
  }
  return false;
}

// Tile used as the habitat centre / nest anchor for a host object
function hostCenter(o) {
  if (o.type === 'building') { const b = BUILDINGS[o.kind]; return [o.x + Math.floor(b.w / 2), o.y + b.h - 1]; }
  return [o.x, o.y];
}

// Which nest-site types a host offers (object, or {tile:[x,y]} for ground)
function sitesOf(S, h) {
  const out = [];
  if (!h) return out;
  if (h.tile) {
    const [x, y] = h.tile, i = tIdx(x, y), t = S.tiles[i];
    if (S.occ[i]) return out;
    if ((t === T.GRASS || t === T.MARSH) && S.grass[i] === 2 && nearWater(S, x, y, 3)) out.push('ground');
    if (t === T.GRASS && S.grass[i] === 2 && countHab(S, 'open', x, y, 3) === 0) out.push('field');
    if ((t === T.GRAVEL || t === T.SAND) && nearWater(S, x, y, 2)) out.push('shingle');
    if ((t === T.FOREST || t === T.GRASS) && countHab(S, 'trees', x, y, 3) >= 4 && countHab(S, 'open', x, y, 1) === 0) out.push('clearing');
    if (t === T.ROCK && (tileAt(S, x, y - 1) === T.CLIFF || tileAt(S, x - 1, y) === T.CLIFF || tileAt(S, x + 1, y) === T.CLIFF)) out.push('ledge');
    if (t !== T.PATH && t !== T.BRIDGE && t !== T.WATER && DIR_VEC.some(([dx, dy]) => tileAt(S, x + dx, y + dy) === T.BRIDGE)) out.push('bridge');
    return out;
  }
  const o = h;
  if (o.type === 'tree') {
    if (o.kind === 'snag') out.push('snag');
    else if (o.st >= 2) {
      if (o.kind === 'pine') out.push('pine');
      else {
        out.push('tree');
        if (o.kind === 'willow' && nearWater(S, o.x, o.y, 2)) out.push('willow');
      }
    }
  } else if (o.type === 'shrub' && o.st >= 2) {
    out.push('shrub');
    if (FLORA[o.kind].thorny) out.push('thorny');
  } else if (o.type === 'plant' && o.kind === 'reed' && o.st >= 2) {
    if (countHab(S, 'reeds', o.x, o.y, 2) >= 6) out.push('reeds');
  } else if (o.type === 'struct' && STRUCTS[o.kind] && STRUCTS[o.kind].site) {
    out.push(STRUCTS[o.kind].site);
  } else if (o.type === 'building') {
    const b = BUILDINGS[o.kind];
    if (b && b.site) out.push(b.site);
    if (b && b.chimney) out.push('chimney');
  }
  return out;
}

// Could this host ever be a site (used to show the "Nest site" option even before maturity)
function isPotentialHost(o) {
  if (!o) return false;
  if (o.type === 'tree' || o.type === 'shrub') return true;
  if (o.type === 'plant' && o.kind === 'reed') return true;
  if (o.type === 'struct' && STRUCTS[o.kind] && STRUCTS[o.kind].site) return true;
  if (o.type === 'building' && BUILDINGS[o.kind] && BUILDINGS[o.kind].site) return true;
  return false;
}

function hostSlots(o) { return o && (o.type === 'building' || (o.type === 'struct' && o.kind === 'bank')) ? 3 : 1; }

function nestsOfHost(S, hostId) {
  const out = [];
  for (const o of S.objs.values()) if (o.type === 'nest' && o.host === hostId) out.push(o);
  return out;
}

function groundNestAt(S, x, y) {
  const o = objAt(S, x, y);
  return o && o.type === 'nest' ? o : null;
}

// Evaluate whether a species would settle at a host. Returns {ok, checks:[{label, ok, have, need, why}]}
function evalNest(S, sp, cx, cy, ignoreId) {
  const checks = [];
  const inSeason = sp.breed.includes(S.time.season);
  checks.push({ label: 'Nesting season: ' + sp.breed.map((s) => SEASON_NAMES[s]).join(', '), ok: inSeason, why: inSeason ? 'Now is the time!' : 'Wait for the right season' });
  for (const h of sp.hab) {
    const have = countHab(S, h.k, cx, cy, h.r);
    let ok, label;
    if (h.k === 'open') { ok = have <= h.n; label = h.n === 0 ? 'No trees within ' + h.r + ' tiles' : 'At most ' + h.n + ' trees within ' + h.r; }
    else if (h.k === 'water' || h.k === 'anvil' || h.k === 'mud') { ok = have >= h.n; label = (h.k === 'anvil' ? 'Anvil stone' : h.k === 'mud' ? 'Mud source' : 'Water') + (h.r <= 1 ? ' right next to it' : ' within ' + h.r + ' tiles'); }
    else { ok = have >= h.n; label = h.n + '+ ' + HAB_KINDS[h.k].unit + ' within ' + h.r; }
    checks.push({ label, ok, have, need: h.n, why: h.why, k: h.k });
  }
  if (sp.terr > 0) {
    let rival = 0;
    for (const o of S.objs.values()) {
      if (o.type !== 'nest' || o.kind !== sp.id || o.id === ignoreId || o.st === 'old') continue;
      const c = nestCenter(S, o);
      if (dist2(c[0], c[1], cx, cy) <= sp.terr * sp.terr) rival++;
    }
    checks.push({ label: 'No rival ' + sp.name + ' within ' + sp.terr + ' tiles', ok: rival === 0, why: 'They defend a territory' });
  }
  return { ok: checks.every((c) => c.ok), checks };
}

function nestCenter(S, n) {
  if (n.host) { const h = S.objs.get(n.host); if (h) return hostCenter(h); }
  return [n.x, n.y];
}

function speciesForSite(site) { return SPECIES.filter((s) => s.site === site); }

function knownSpecies(S, id) { const j = S.journal[id]; return j && j.h >= 3; }

function isPlantable(item, t, S, x, y) {
  const it = ITEMS[item];
  if (!it) return false;
  if (it.wet) return t === T.SHALLOW || t === T.MARSH || t === T.MUD;
  if (it.plant === 'willow') return t === T.GRASS || t === T.FOREST || t === T.SOIL || t === T.MARSH;
  return t === T.GRASS || t === T.FOREST || t === T.SOIL || (t === T.MARSH && it.cat !== 'seed');
}

// Can the item in hand be placed on tile (x,y)? Returns {ok, reason}
function canPlace(S, item, x, y, players) {
  const it = ITEMS[item];
  if (!it || !(it.cat === 'seed' || it.cat === 'tree' || it.cat === 'shrub' || it.cat === 'struct')) return { ok: false };
  if (!inBounds(x, y) || x < 1 || y < 1 || x >= MAP_W - 1 || y >= MAP_H - 1) return { ok: false, reason: 'Out of bounds' };
  const i = tIdx(x, y), t = S.tiles[i];
  if (S.occ[i]) return { ok: false, reason: 'Something is already here' };
  if (objsOnTile(S, x, y).some((o) => o.type === 'nest' || o.type === 'puddle')) return { ok: false, reason: 'Something is already here' };
  if (it.cat === 'struct') {
    if (it.struct === 'pondpatch') {
      if (!(t === T.GRASS || t === T.SOIL || t === T.FOREST || t === T.MARSH || t === T.MUD)) return { ok: false, reason: 'Dig ponds on grass or soil' };
      return { ok: true };
    }
    if (!(t === T.GRASS || t === T.FOREST || t === T.SOIL || t === T.SAND || t === T.GRAVEL || t === T.MARSH || t === T.ROCK || t === T.CLAY || t === T.MUD))
      return { ok: false, reason: 'Can\'t build here' };

  } else if (!isPlantable(item, t, S, x, y)) {
    return { ok: false, reason: it.wet ? 'Needs shallow water, marsh or mud' : 'Can\'t plant here' };
  }
  // don't trap players
  if (players) {
    for (const p of players) {
      if (p.sleep) continue;
      const px = Math.floor(p.x / TS), py = Math.floor(p.y / TS);
      if (px === x && py === y) return { ok: false, reason: 'Someone is standing here' };
    }
  }
  return { ok: true };
}

function placeLabel(item) {
  const it = ITEMS[item];
  if (!it) return '';
  if (it.cat === 'struct') return it.struct === 'pondpatch' ? 'Dig a pond' : 'Place ' + it.name;
  return 'Plant ' + it.name;
}

function harvestInfo(S, o) {
  if (o.type !== 'plant' || o.st < 2) return null;
  const h = FLORA[o.kind].harvest;
  if (!h || !h.seasons.includes(S.time.season)) return null;
  if (o.hv === dayIdx(S.time)) return null;
  return h;
}

const HARVEST_LABEL = { thistledown: 'Pick thistle down', herbs: 'Pick fragrant herbs', reedplume: 'Cut reed plumes', fluff: 'Pluck cattail fluff' };
const FORAGE_NAMES = { twig: 'twigs', stick: 'a stick', leaves: 'dead leaves', feather: 'a feather', stone: 'a stone',
  driftwood: 'driftwood', mushroom: 'a chanterelle', garlic: 'wild garlic', note: 'the Field Note' };

// Quick action (E) for an object. Returns {op, label} or null.
function quickOp(S, o, pid) {
  const today = dayIdx(S.time);
  switch (o.type) {
    case 'tree':
      if (o.kind === 'snag' || o.st < 1) return null;
      if (o.fr > 0 && o.kind === 'apple') return { op: 'shake', label: 'Shake for apples' };
      if (o.kind === 'pine' && o.st >= 2 && o.bk !== today) return { op: 'bark', label: 'Peel bark flakes' };
      if (o.sh === today) return null;
      if (o.kind === 'willow' && S.time.season === SPRING && o.st >= 2) return { op: 'shake', label: 'Shake (willow fluff)' };
      return { op: 'shake', label: 'Shake tree' };
    case 'shrub':
      if (o.fr > 0) return { op: 'pick', label: 'Pick ' + ITEMS[FLORA[o.kind].fruit.item].name.toLowerCase() };
      if (o.st >= 1 && o.sh !== today) return { op: 'shake', label: 'Snap twigs' };
      return null;
    case 'plant': {
      const h = harvestInfo(S, o);
      return h ? { op: 'harvest', label: HARVEST_LABEL[h.mat] } : null;
    }
    case 'rock':
      if (o.kind === 'mossy' && o.moss > 0) return { op: 'moss', label: 'Scrape moss' };
      if (o.kind === 'boulder' && o.li > 0) return { op: 'lichen', label: 'Scrape lichen' };
      return null;
    case 'log':
      if (o.rv !== today) return { op: 'rot', label: 'Crumble rotten wood' };
      if (o.moss > 0) return { op: 'moss', label: 'Scrape moss' };
      return null;
    case 'stump': return o.moss > 0 ? { op: 'moss', label: 'Scrape moss' } : null;
    case 'forage': return { op: 'collect', label: 'Pick up ' + (FORAGE_NAMES[o.kind] || o.kind) };
    case 'web': return { op: 'collect', label: 'Gather spider silk' };
    case 'puddle': return { op: 'collect', label: 'Scoop mud' };
    case 'qitem': return { op: 'collect', label: 'Pick up ' + QITEMS[o.kind].name };
    case 'landmark': return { op: 'look', label: 'Look at the ' + LANDMARKS[o.kind].name };
    default: return null;
  }
}

function tileOp(S, x, y) {
  if (!inBounds(x, y)) return null;
  const i = tIdx(x, y), t = S.tiles[i];
  if (S.occ[i]) return null;
  if ((t === T.GRASS || t === T.MARSH) && S.grass[i] === 2) return { op: 'cut', label: 'Cut long grass' };
  const dug = S.dug && S.dug[i] === dayIdx(S.time);
  if (t === T.MUD) return dug ? null : { op: 'mud', label: 'Scoop mud' };
  if (t === T.SAND) return dug ? null : { op: 'sand', label: 'Dig sand' };
  if (t === T.CLAY) return dug ? null : { op: 'clay', label: 'Dig clay' };
  if (t === T.GRAVEL) return dug ? null : { op: 'gravel', label: 'Pick up stones' };
  return null;
}

// ---------- villagers & side quests ----------
const dirTo = (dx, dy) => (Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? 1 : 2) : (dy < 0 ? 3 : 0));

// Where a villager is at a given minute of the day: {x, y (tiles), dir, moving, away}
function npcPos(id, min) {
  const n = NPCS[id];
  let x, y, dir, away;
  if (n.start) { [x, y, dir] = n.start; away = false; } else { [x, y] = n.home; dir = 0; away = true; }
  for (const [t, pts, edir, flag] of n.sched || []) {
    if (min < t) break;
    let budget = (min - t) * NPC_SPEED, cx = x, cy = y;
    for (const [px, py] of pts) {
      const len = Math.hypot(px - cx, py - cy);
      if (budget < len) {
        const f = budget / len;
        return { x: cx + (px - cx) * f, y: cy + (py - cy) * f, dir: dirTo(px - cx, py - cy), moving: true, away: false };
      }
      budget -= len; cx = px; cy = py;
    }
    x = cx; y = cy; dir = edir; away = flag === 'away';
  }
  return { x, y, dir, moving: false, away };
}

// Side quests: state is S.side[id] = {st: 'on'|'done', n, seen}
function questGateOpen(S) { return S.quest >= TUTORIAL.findIndex((t) => t.id === 'arrive'); }
function questProgress(S, q) {
  const st = S.side && S.side[q.id];
  if (!st) return 0;
  if (q.kind === 'bring') return Math.min(q.n, S.mats[q.mat] || 0);
  if (q.kind === 'visit') return Math.min(q.n, Object.keys(S.found || {}).length);
  if (q.kind === 'observe') return Math.min(q.n, (st.seen || []).length);
  return Math.min(q.n, st.n || 0);
}
function questReady(S, q) { return questProgress(S, q) >= q.n; }
// The quest a villager has for you right now: {q, state: 'offer'|'active'|'ready'} or null
function npcQuest(S, npc) {
  if (!questGateOpen(S)) return null;
  for (const q of QUESTS) {
    if (q.npc !== npc) continue;
    const st = S.side && S.side[q.id];
    if (st && st.st === 'done') continue;
    if (st && st.st === 'on') return { q, state: questReady(S, q) ? 'ready' : 'active' };
    if (q.after && !(S.side[q.after] && S.side[q.after].st === 'done')) return null;
    return { q, state: 'offer' };
  }
  return null;
}

function speciesName(S, id) {
  const j = S.journal[id];
  return j && j.h > 0 ? SPECIES_BY_ID[id].name : 'unknown bird';
}

function nestedCount(S) {
  let n = 0;
  for (const sp of SPECIES) if (S.journal[sp.id] && S.journal[sp.id].n > 0) n++;
  return n;
}

function unlockedTier(S) {
  const n = nestedCount(S);
  let t = 0;
  for (let i = 0; i < TIER_UNLOCK.length; i++) if (n >= TIER_UNLOCK[i]) t = i;
  return t;
}

const NEST_STAGE_LABEL = {
  cock: 'Cock nest — waiting for a female to choose',
  lining: 'Chosen! Needs a feather lining',
  built: 'Waiting for a pair to move in',
  pair: 'A pair has moved in',
  eggs: 'Incubating eggs',
  chicks: 'Feeding chicks',
  fledged: 'Fledged!',
  old: 'Old nest',
};

// ---- js/sim/mapgen.js ----
// Deterministic generation of Featherbrook Valley (96 x 72 tiles).

// Named zones [x0, y0, x1, y1] (inclusive) used for spawning forage, clues and visiting birds.
const ZONES = {
  garden: [34, 20, 57, 37],
  forest: [2, 1, 70, 14],
  pines: [1, 1, 18, 14],
  farm: [2, 19, 28, 38],
  meadow: [2, 39, 28, 49],
  pond: [11, 50, 37, 67],
  village: [57, 21, 76, 40],
  orchard: [45, 36, 58, 47],
  hills: [73, 1, 93, 21],
  eastmeadow: [84, 24, 93, 63],
  southmeadow: [40, 57, 92, 68],
};

const RIVER_PTS = [[86, -1], [85, 6], [83, 12], [81, 18], [80, 24], [80, 30], [79.5, 36], [77.5, 42], [73, 47],
  [66, 50.5], [58, 51.5], [50, 52.5], [42, 54.5], [36, 57], [32, 58]];
const OUTFLOW_PTS = [[16, 60.5], [9, 62], [-1, 63]];

const HOME_SPAWN = [44 * TS + 8, 29 * TS + 4]; // in front of the cottage door (px)

function segDist(px, py, ax, ay, bx, by) {
  const vx = bx - ax, vy = by - ay, wx = px - ax, wy = py - ay;
  const L = vx * vx + vy * vy;
  let t = L ? (wx * vx + wy * vy) / L : 0;
  t = t < 0 ? 0 : t > 1 ? 1 : t;
  const dx = ax + vx * t - px, dy = ay + vy * t - py;
  return Math.sqrt(dx * dx + dy * dy);
}
function polyDist(px, py, pts) {
  let d = 1e9;
  for (let i = 0; i < pts.length - 1; i++) d = Math.min(d, segDist(px, py, pts[i][0], pts[i][1], pts[i + 1][0], pts[i + 1][1]));
  return d;
}

function generateMap(seed) {
  const W = MAP_W, H = MAP_H;
  const tiles = new Uint8Array(W * H).fill(T.GRASS);
  const grass = new Uint8Array(W * H);
  const wild = new Uint8Array(W * H);
  const reserved = new Uint8Array(W * H);
  const occ = new Uint8Array(W * H);
  const objs = [];
  const rnd = mulberry32(seed ^ 0x5eed);
  const I = (x, y) => y * W + x;
  const inb = (x, y) => x >= 0 && y >= 0 && x < W && y < H;
  const get = (x, y) => (inb(x, y) ? tiles[I(x, y)] : T.CLIFF);
  const set = (x, y, t) => { if (inb(x, y)) tiles[I(x, y)] = t; };
  const isLand = (t) => t !== T.WATER && t !== T.SHALLOW && t !== T.CLIFF && t !== T.BRIDGE;
  const inRect = (x, y, r) => x >= r[0] && y >= r[1] && x <= r[2] && y <= r[3];

  // ---- 1. forest, hills, borders ----
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const edge = 13 + 3 * fbm(x * 0.09, 3.3, seed + 11, 3);
    if (x < 73 && y < edge) set(x, y, T.FOREST);
    if (x < 2 && y >= 12) set(x, y, T.FOREST);
    if (y >= H - 2) set(x, y, T.FOREST);
    if (x >= W - 2 && y >= 20) set(x, y, T.FOREST);
    const hillEdge = 19 + 3 * fbm(x * 0.15, 8.1, seed + 23, 2);
    if (x >= 72 + 2 * fbm(5.5, y * 0.2, seed + 5, 2) && y < hillEdge) set(x, y, T.ROCK);
  }
  // hill borders and outcrops
  for (let x = 72; x < W; x++) { set(x, 0, T.CLIFF); }
  for (let y = 0; y < 22; y++) { set(W - 1, y, T.CLIFF); set(W - 2, y, T.CLIFF); }
  for (const [cx, cy, w, h] of [[75, 4, 3, 2], [90, 9, 3, 2], [77, 14, 2, 2], [91, 17, 2, 2]]) {
    for (let y = cy; y < cy + h; y++) for (let x = cx; x < cx + w; x++) set(x, y, T.CLIFF);
  }

  // ---- 2. river ----
  const riverside = [];
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const d = polyDist(x + 0.5, y + 0.5, RIVER_PTS) + (valueNoise(x * 0.4, y * 0.4, seed + 3) - 0.5) * 0.5;
    if (d < 1.5) set(x, y, T.WATER);
    else if (d < 2.5) set(x, y, T.SHALLOW);
    else if (d < 4.5) riverside.push([x, y]);
    const d2 = polyDist(x + 0.5, y + 0.5, OUTFLOW_PTS);
    if (d2 < 0.9) set(x, y, T.WATER);
    else if (d2 < 1.7 && get(x, y) !== T.WATER) set(x, y, T.SHALLOW);
  }

  // ---- 3. ponds ----
  function pond(cx, cy, rx, ry, deep, marsh, mudFn) {
    for (let y = Math.floor(cy - ry * 1.6); y <= cy + ry * 1.6; y++) for (let x = Math.floor(cx - rx * 1.6); x <= cx + rx * 1.6; x++) {
      if (!inb(x, y)) continue;
      const nx = (x + 0.5 - cx) / rx, ny = (y + 0.5 - cy) / ry;
      const small = rx < 3.5;
      const e = Math.sqrt(nx * nx + ny * ny) + (valueNoise(x * 0.5, y * 0.5, seed + 77) - 0.5) * (small ? 0.42 : 0.18);
      const t = get(x, y);
      if (e < deep) set(x, y, T.WATER);
      else if (e < 1.0) { if (t !== T.WATER) set(x, y, T.SHALLOW); }
      else if (mudFn && mudFn(e, x + 0.5 - cx, y + 0.5 - cy) && isLand(t)) set(x, y, T.MUD);
      else if (e < marsh && (t === T.GRASS || t === T.FOREST)) set(x, y, T.MARSH);
    }
  }
  pond(24, 58, 9.5, 6, 0.62, 1.38, (e, dx, dy) => e < 1.22 && dx > 1 && dy < 1 && dx > -dy * 0.3);
  pond(22.5, 25.5, 2.7, 2.0, 0.55, 1.0, (e, dx, dy) => e < 1.4 && dy > 0.3);
  pond(50.5, 33.5, 3.0, 2.2, 0.45, 1.0, (e, dx, dy) => e < 1.32 && dx < -1.8 && Math.abs(dy) < 1.4);
  pond(89.5, 45.5, 3.2, 2.4, 0.55, 1.6, null);

  // ---- 4. sand, gravel, clay along the river ----
  for (const [x, y] of riverside) {
    const t = get(x, y);
    if (!isLand(t)) continue;
    if (dist2(x, y, 75.5, 41.5) < 7 || dist2(x, y, 53, 55.5) < 7 || dist2(x, y, 37.5, 55.5) < 3.5 || dist2(x, y, 84.5, 33.5) < 3) set(x, y, T.SAND);
    else if (dist2(x, y, 83, 21.5) < 5 || dist2(x, y, 77.5, 26) < 2.5) set(x, y, T.GRAVEL);
    else if (dist2(x, y, 69.5, 46.5) < 2.6 || dist2(x, y, 45, 56.5) < 2) set(x, y, T.CLAY);
  }

  // ---- 5. paths & bridges ----
  function path(pts, hw) {
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      if (polyDist(x + 0.5, y + 0.5, pts) < (hw || 0.75)) {
        const t = get(x, y);
        if (isLand(t) && t !== T.MUD) set(x, y, T.PATH);
        if (isLand(t)) reserved[I(x, y)] = 1;
      }
    }
  }
  path([[12, 28.5], [20, 29.5], [30, 30.5], [40, 30.5], [50, 30.5], [52, 30.5], [60, 30.5], [70, 30.5], [77, 30.5]], 0.8);
  path([[83, 30.5], [88, 31.5], [89.5, 37], [89.5, 41]], 0.95);
  path([[36, 30.5], [36, 23], [37, 16], [36, 9], [33, 3]], 0.95);
  path([[44.5, 28], [44.5, 30.5]]);
  path([[44.5, 30.5], [45.5, 36], [52, 42], [58.5, 46.5], [58.5, 49]], 0.95);
  path([[58.5, 54], [59.5, 60], [66, 64.5]], 0.95);
  path([[62.5, 30.5], [62.5, 28]]);
  path([[66, 30.5], [68, 33], [69.5, 36.5]]);
  path([[12, 28.5], [9.5, 27], [8.5, 26.5]]);
  path([[30, 30.5], [28.5, 40], [28.5, 48], [29, 51]], 0.95);
  path([[52.5, 27], [52.5, 30.5]]);           // Rose Cottage
  path([[70.5, 26], [70.5, 30.5]]);           // Willow House
  path([[18.5, 21], [18.5, 28.5]]);           // Mabel's farmhouse
  for (let x = 74; x <= 87; x++) for (let y = 30; y <= 31; y++) if (isWaterT(get(x, y))) { set(x, y, T.BRIDGE); reserved[I(x, y)] = 1; }
  for (let y = 46; y <= 57; y++) for (let x = 58; x <= 59; x++) if (isWaterT(get(x, y))) { set(x, y, T.BRIDGE); reserved[I(x, y)] = 1; }

  // ---- 6. grass heights (wild meadows grow long, lawns stay short) ----
  const lawnRects = [[33, 19, 58, 38], [56, 21, 77, 41], [44, 35, 59, 48], [2, 19, 29, 38]];
  const meadowRects = [[2, 39, 28, 49], [84, 23, 93, 64], [40, 57, 92, 68], [62, 38, 76, 46], [18, 50, 40, 68]];
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = I(x, y), t = tiles[i];
    if (t !== T.GRASS && t !== T.MARSH) continue;
    if (reserved[i]) continue;
    let isWild = t === T.MARSH;
    for (const r of meadowRects) if (inRect(x, y, r)) isWild = true;
    if (!isWild && fbm(x * 0.13, y * 0.13, seed + 41, 3) > 0.64) isWild = true;
    for (const r of lawnRects) if (inRect(x, y, r)) isWild = t === T.MARSH;
    if (isWild) {
      wild[i] = 1;
      const n = valueNoise(x * 0.35, y * 0.35, seed + 9);
      grass[i] = n < 0.18 ? 1 : 2;
    }
  }

  // ---- placement helpers ----
  let nextTmp = 1;
  function free(x, y) { return inb(x, y) && !occ[I(x, y)] && !reserved[I(x, y)]; }
  function put(o, w, h) {
    w = w || 1; h = h || 1;
    for (let dy = 0; dy < h; dy++) for (let dx = 0; dx < w; dx++) occ[I(o.x + dx, o.y + dy)] = 1;
    o.nat = 1;
    objs.push(o);
    return o;
  }
  function reserveRect(x0, y0, x1, y1) {
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) if (inb(x, y)) reserved[I(x, y)] = 1;
  }
  function treeNear(x, y, r) {
    for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
      if (!inb(x + dx, y + dy)) continue;
      if (occ[I(x + dx, y + dy)] === 2) return true;
    }
    return false;
  }
  function putTree(kind, x, y, st) {
    if (!free(x, y) || treeNear(x, y, 1)) return null;
    const t = get(x, y);
    if (!isLand(t) || t === T.PATH || t === T.MUD || t === T.ROCK && kind !== 'pine') return null;
    const o = put({ type: 'tree', kind, x, y, st: st == null ? 2 : st, g: 0 });
    occ[I(x, y)] = 2;
    return o;
  }
  function nearestFree(x, y, test) {
    for (let r = 0; r < 6; r++) for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
      if (Math.max(Math.abs(dx), Math.abs(dy)) !== r) continue;
      if (free(x + dx, y + dy) && (!test || test(x + dx, y + dy))) return [x + dx, y + dy];
    }
    return null;
  }

  // ---- 7. buildings ----
  function building(kind, x, y) {
    const b = BUILDINGS[kind];
    for (let dy = 0; dy < b.h; dy++) for (let dx = 0; dx < b.w; dx++) { set(x + dx, y + dy, T.GRASS); grass[I(x + dx, y + dy)] = 0; wild[I(x + dx, y + dy)] = 0; }
    put({ type: 'building', kind, x, y }, b.w, b.h);
    reserveRect(x - 1, y - 1, x + b.w, y + b.h);
  }
  building('cottage', 42, 25);
  building('house1', 50, 24);
  building('house2', 68, 23);
  building('farmhouse', 16, 18);
  building('barn', 6, 22);
  building('coop', 14, 23);
  building('shop', 60, 25);
  building('station', 67, 33);
  building('bench', 39, 26);
  building('mailbox', 46, 28);
  building('well', 72, 29);
  // keep the spots where villagers stand clear (their routes follow paths)
  for (const k in NPCS) {
    const n = NPCS[k], spots = [];
    if (n.start) spots.push(n.start);
    for (const e of n.sched) spots.push(e[1][e[1].length - 1]);
    for (const [x, y] of spots) reserveRect(Math.floor(x) - 1, Math.floor(y) - 1, Math.floor(x) + 1, Math.floor(y) + 1);
  }
  // landmarks
  for (const k in LANDMARKS) {
    const l = LANDMARKS[k], w = l.w || 1, h = l.h || 1;
    const ok = (x, y) => { for (let dy = 0; dy < h; dy++) for (let dx = 0; dx < w; dx++) { const t = get(x + dx, y + dy); if (!free(x + dx, y + dy) || !isLand(t) || t === T.PATH) return false; } return true; };
    let at = null;
    for (let r = 0; r < 6 && !at; r++) for (let dy = -r; dy <= r && !at; dy++) for (let dx = -r; dx <= r && !at; dx++) {
      if (Math.max(Math.abs(dx), Math.abs(dy)) === r && ok(l.at[0] + dx, l.at[1] + dy)) at = [l.at[0] + dx, l.at[1] + dy];
    }
    if (!at) continue;
    put({ type: 'landmark', kind: k, x: at[0], y: at[1] }, w, h);
    reserveRect(at[0] - 1, at[1] - 1, at[0] + w, at[1] + h);
    for (let dy = 0; dy < h; dy++) for (let dx = 0; dx < w; dx++) { grass[I(at[0] + dx, at[1] + dy)] = 0; }
  }

  // ---- 8. fences (pens) ----
  function pen(x0, y0, x1, y1, gates) {
    for (let x = x0; x <= x1; x++) for (const y of [y0, y1]) {
      if (gates.some((g) => g[0] === x && g[1] === y)) continue;
      if (!occ[I(x, y)]) put({ type: 'fence', kind: 'wood', x, y });
    }
    for (let y = y0 + 1; y < y1; y++) for (const x of [x0, x1]) {
      if (gates.some((g) => g[0] === x && g[1] === y)) continue;
      if (!occ[I(x, y)]) put({ type: 'fence', kind: 'wood', x, y });
    }
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) { reserved[I(x, y)] = 1; if (tiles[I(x, y)] === T.GRASS) { grass[I(x, y)] = 0; wild[I(x, y)] = 0; } }
  }
  pen(3, 31, 13, 37, [[8, 31], [9, 31]]);
  pen(16, 31, 23, 36, [[19, 31], [20, 31]]);

  // ---- 9. fixed trees & shrubs ----
  const fixedTrees = [
    ['oak', 37, 23], ['apple', 56, 27], ['oak', 58, 37], ['birch', 74, 26], ['birch', 55, 22], ['birch', 30, 35],
    ['oak', 25, 20], ['oak', 4, 20], ['birch', 24, 44], ['oak', 50, 63], ['oak', 80, 65], ['birch', 75, 60], ['birch', 45, 62],
    ['birch', 88, 52], ['oak', 66, 38], ['birch', 35, 39],
    // willows by water
    ['willow', 13, 53], ['willow', 16, 64], ['willow', 31, 52], ['willow', 34, 62], ['willow', 10, 58], ['willow', 27, 65],
    ['willow', 70, 44], ['willow', 62, 48], ['willow', 47, 51], ['willow', 83, 38], ['willow', 84, 26], ['willow', 86, 43],
    ['willow', 93, 47], ['willow', 25, 23], ['willow', 53, 35],
  ];
  for (const [k, x, y] of fixedTrees) { const p = nearestFree(x, y, (a, b) => isLand(get(a, b)) && get(a, b) !== T.PATH); if (p) putTree(k, p[0], p[1]); }
  for (const x of [47, 50, 53, 56]) for (const y of [38, 41, 44]) {
    const jx = x + (hashf(x, y, seed) < 0.5 ? 0 : 1);
    putTree('apple', jx, y);
  }
  // snags (standing dead trees)
  for (const [x, y] of [[26, 9], [52, 6], [61, 12], [11, 11], [33, 12], [66, 4]]) {
    const p = nearestFree(x, y, (a, b) => isLand(get(a, b)) && get(a, b) !== T.PATH);
    if (p) { put({ type: 'tree', kind: 'snag', x: p[0], y: p[1], st: 2 }); occ[I(p[0], p[1])] = 2; }
  }

  function putShrub(kind, x, y) {
    if (!free(x, y)) return null;
    const t = get(x, y);
    if (!(t === T.GRASS || t === T.FOREST || t === T.MARSH)) return null;
    return put({ type: 'shrub', kind, x, y, st: 2, g: 0, fr: 0 });
  }
  for (const [k, x, y] of [['hawthorn', 38, 31], ['elder', 48, 23], ['hazel', 36, 34], ['bramble', 55, 35],
    ['hawthorn', 57, 24], ['elder', 75, 37], ['blackthorn', 64, 36], ['hazel', 26, 33], ['bramble', 19, 51],
    ['bramble', 33, 56], ['elder', 18, 20], ['hawthorn', 52, 28]]) {
    const p = nearestFree(x, y, (a, b) => get(a, b) === T.GRASS || get(a, b) === T.FOREST);
    if (p) putShrub(k, p[0], p[1]);
  }
  // hedgerows
  const hedgeKinds = ['hawthorn', 'blackthorn', 'hawthorn', 'bramble', 'hazel', 'elder', 'blackthorn'];
  for (let x = 18; x <= 68; x++) {
    if (x > 32 && x < 40) continue;
    if (hashf(x, 16, seed) < 0.42) putShrub(hedgeKinds[Math.floor(hashf(x, 17, seed) * hedgeKinds.length)], x, 16 + (hashf(x, 18, seed) < 0.5 ? 0 : 1));
  }
  for (let y = 19; y <= 38; y++) {
    if (y >= 28 && y <= 32) continue;
    if (hashf(32, y, seed) < 0.55) putShrub(hedgeKinds[Math.floor(hashf(33, y, seed) * hedgeKinds.length)], 32, y);
  }
  for (let x = 40; x <= 92; x++) {
    if (x >= 64 && x <= 67) continue;
    if (hashf(x, 68, seed) < 0.5) putShrub(['hawthorn', 'blackthorn', 'bramble'][Math.floor(hashf(x, 69, seed) * 3)], x, 68);
  }

  // ---- 10. forests ----
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const t = get(x, y);
    if (t !== T.FOREST) continue;
    const clearing = fbm(x * 0.11, y * 0.11, seed + 61, 3) > 0.63;
    const border = x < 2 || y >= H - 2 || x >= W - 2;
    const dens = border ? 0.75 : clearing ? 0.04 : 0.36;
    if (rnd() > dens) continue;
    let kind;
    if (x < 19 && y < 15) kind = rnd() < 0.85 ? 'pine' : 'birch';
    else { const r = rnd(); kind = r < 0.5 ? 'oak' : r < 0.84 ? 'birch' : 'pine'; }
    putTree(kind, x, y);
  }
  // forest understory shrubs
  for (let i = 0; i < 40; i++) {
    const x = 3 + Math.floor(rnd() * 66), y = 2 + Math.floor(rnd() * 12);
    if (get(x, y) === T.FOREST) putShrub(['hazel', 'elder', 'bramble', 'hazel'][Math.floor(rnd() * 4)], x, y);
  }

  // ---- 11. rocks, logs, stumps ----
  let placed = 0;
  for (let tries = 0; tries < 400 && placed < 14; tries++) {
    const x = 73 + Math.floor(rnd() * 20), y = 1 + Math.floor(rnd() * 19);
    if (get(x, y) === T.ROCK && free(x, y)) { put({ type: 'rock', kind: 'boulder', x, y, li: 2 }); placed++; }
  }
  for (const [x, y] of [[20, 45], [86, 57], [70, 64], [12, 42]]) { const p = nearestFree(x, y); if (p) put({ type: 'rock', kind: 'boulder', x: p[0], y: p[1], li: 2 }); }
  placed = 0;
  for (let tries = 0; tries < 600 && placed < 12; tries++) {
    const x = 3 + Math.floor(rnd() * 66), y = 2 + Math.floor(rnd() * 12);
    if (get(x, y) === T.FOREST && free(x, y)) { put({ type: 'rock', kind: 'mossy', x, y, moss: 2 }); placed++; }
  }
  placed = 0;
  for (let tries = 0; tries < 800 && placed < 10; tries++) {
    const x = 3 + Math.floor(rnd() * 65), y = 2 + Math.floor(rnd() * 12);
    if (get(x, y) === T.FOREST && get(x + 1, y) === T.FOREST && free(x, y) && free(x + 1, y)) {
      put({ type: 'log', kind: 'oak', x, y, moss: 2, rv: -1 }, 2, 1); placed++;
    }
  }
  placed = 0;
  for (let tries = 0; tries < 600 && placed < 8; tries++) {
    const x = 3 + Math.floor(rnd() * 66), y = 2 + Math.floor(rnd() * 13);
    if (get(x, y) === T.FOREST && free(x, y)) { put({ type: 'stump', kind: 'oak', x, y, moss: 1 }); placed++; }
  }

  // ---- 12. plants ----
  function scatterPlant(kind, n, rect, test) {
    let c = 0;
    for (let tries = 0; tries < 600 && c < n; tries++) {
      const x = rect[0] + Math.floor(rnd() * (rect[2] - rect[0] + 1)), y = rect[1] + Math.floor(rnd() * (rect[3] - rect[1] + 1));
      if (!free(x, y) || !test(get(x, y))) continue;
      put({ type: 'plant', kind, x, y, st: 2, g: 0, hv: -1 });
      c++;
    }
  }
  const wet = (t) => t === T.SHALLOW || t === T.MARSH;
  const dry = (t) => t === T.GRASS;
  scatterPlant('reed', 7, [14, 51, 34, 65], wet);
  scatterPlant('cattail', 5, [14, 51, 34, 65], wet);
  scatterPlant('reed', 2, [19, 23, 26, 28], wet);
  scatterPlant('reed', 3, [85, 42, 94, 49], wet);
  scatterPlant('cattail', 2, [85, 42, 94, 49], wet);
  scatterPlant('reed', 5, [40, 48, 78, 56], (t) => t === T.SHALLOW);
  scatterPlant('thistle', 4, [44, 58, 90, 67], dry);
  scatterPlant('thistle', 2, [3, 40, 27, 48], dry);
  scatterPlant('wildflower', 8, [42, 58, 90, 67], dry);
  scatterPlant('wildflower', 4, [85, 24, 93, 62], dry);
  scatterPlant('wildflower', 4, [3, 40, 27, 48], dry);
  scatterPlant('wildflower', 3, [35, 32, 56, 37], dry);

  return { tiles, grass, wild, objs, riverside };
}

// ---- js/sim/world.js ----
// The authoritative world simulation. It runs in the browser of the solo player or co-op host.
// Clients (including the host's own view) talk to it only through messages, so solo and
// multiplayer behave identically.

const PLANT_ITEM = {
  oak: 'sap_oak', birch: 'sap_birch', willow: 'sap_willow', pine: 'sap_pine', apple: 'sap_apple',
  hawthorn: 'cut_hawthorn', blackthorn: 'cut_blackthorn', bramble: 'cut_bramble', elder: 'cut_elder', hazel: 'cut_hazel',
  wildflower: 'seed_wildflower', thistle: 'seed_thistle', herbs: 'seed_herbs', reed: 'rhizome_reed', cattail: 'rhizome_cattail',
  snag: 'snag',
};

const ANIMAL_PENS = {
  sheep: [4 * TS + 6, 32 * TS + 8, 13 * TS - 6, 37 * TS - 2],
  horse: [17 * TS + 8, 32 * TS + 8, 23 * TS - 8, 36 * TS - 2],
  chicken: [12 * TS + 4, 26 * TS + 6, 19 * TS + 10, 29 * TS + 12],
};

class World {
  constructor() {
    this.out = null;          // { send(pid, msg), broadcast(msg) }
    this.onSave = null;       // called when the world should be saved
    this.pendAll = [];
    this.pendTo = new Map();
    this.players = new Map(); // pid -> player (online)
    this.saved = {};          // token -> persistent player record
    this.pauseSet = new Set();
    this.msAcc = 0;
    this.posTimer = 0;
    this.saveTimer = 0;
    this.bulk = false;
    this.observed = {};
  }

  static create(name, seed) {
    const w = new World();
    w.name = name || 'Featherbrook';
    w.seed = seed >>> 0;
    const m = generateMap(w.seed);
    w._setupMap(m);
    w.tiles = m.tiles;
    w.grass = m.grass;
    w.nextId = 1;
    for (const o of m.objs) { o.id = w.nextId++; idxAdd(w, o); }
    w.time = { min: DAY_START, day: 1, season: SPRING, year: 1 };
    w.weather = 'sun';
    w.coins = 250;
    w.mats = {};
    for (const k of MAT_ORDER) w.mats[k] = 0;
    w.mats.wood = 5;
    w.journal = {};
    for (const sp of SPECIES) w.journal[sp.id] = { h: 0, n: 0, seen: false, first: null };
    w.log = [];
    w.mail = [];
    w.mailSeq = 1;
    w.quest = 0;
    w.tierSent = 0;
    w.adaDay = -1;
    w.allDone = false;
    w.stats = { fledged: 0, built: 0, days: 1 };
    w.dug = {};
    w.featured = [];
    w.visitors = [];
    w.side = {};
    w.found = {};
    w.sendMail(LETTERS.welcome);
    w._makeAnimals();
    w.bulk = true;
    w.startDay();
    w.bulk = false;
    w.pendAll = [];
    return w;
  }

  static fromSave(d) {
    const w = new World();
    w.name = d.name; w.seed = d.seed >>> 0;
    const m = generateMap(w.seed);
    w._setupMap(m);
    w.tiles = b64decode(d.tiles);
    w.grass = b64decode(d.grass);
    w.nextId = d.nextId;
    for (const o of d.objs) idxAdd(w, o);
    w.time = d.time; w.weather = d.weather; w.coins = d.coins; w.mats = d.mats;
    for (const k of MAT_ORDER) if (w.mats[k] == null) w.mats[k] = 0;
    w.journal = d.journal;
    for (const sp of SPECIES) if (!w.journal[sp.id]) w.journal[sp.id] = { h: 0, n: 0, seen: false, first: null };
    w.log = d.log || []; w.mail = d.mail || []; w.mailSeq = d.mailSeq || 1;
    w.quest = d.quest || 0; w.tierSent = d.tierSent || 0; w.adaDay = d.adaDay == null ? -1 : d.adaDay;
    w.allDone = !!d.allDone; w.stats = d.stats || { fledged: 0, built: 0, days: 1 };
    w.dug = d.dug || {};
    w.featured = d.featured || []; w.visitors = d.visitors || [];
    w.side = d.side || {}; w.found = d.found || {};
    w.saved = d.players || {};
    w._addNewBuildings(m);
    w._makeAnimals();
    if (!w.featured.length) { w.bulk = true; w.pickFeatured(); w.bulk = false; w.pendAll = []; }
    return w;
  }

  // Worlds saved before a building existed get it now, if its plot is still free
  _addNewBuildings(m) {
    const land = (t) => !isWaterT(t) && t !== T.CLIFF && t !== T.BRIDGE;
    for (const o of m.objs) {
      if (o.type !== 'building' && o.type !== 'landmark') continue;
      if (Array.from(this.objs.values()).some((q) => q.type === o.type && q.kind === o.kind)) continue;
      const b = o.type === 'building' ? BUILDINGS[o.kind] : { w: LANDMARKS[o.kind].w || 1, h: LANDMARKS[o.kind].h || 1 };
      // the plot may hold untouched wild plants and litter, but nothing players made and no nests
      const clear = new Set();
      let ok = true;
      for (let dy = 0; dy < b.h && ok; dy++) for (let dx = 0; dx < b.w && ok; dx++) {
        const i = tIdx(o.x + dx, o.y + dy);
        if (!land(this.tiles[i]) || this.tiles[i] === T.PATH) { ok = false; break; }
        for (const id of this.byTile.get(i) || []) {
          const q = this.objs.get(id);
          if (!q) continue;
          const wild = q.nat && ['tree', 'shrub', 'plant', 'rock', 'log', 'stump'].includes(q.type) && !nestsOfHost(this, q.id).length;
          if (wild || q.type === 'forage' || q.type === 'web' || q.type === 'puddle') clear.add(q);
          else { ok = false; break; }
        }
      }
      if (!ok) continue;
      for (const q of clear) idxRemove(this, q);
      for (let dy = 0; dy < b.h; dy++) for (let dx = 0; dx < b.w; dx++) {
        const i = tIdx(o.x + dx, o.y + dy);
        this.tiles[i] = T.GRASS; this.grass[i] = 0;
      }
      idxAdd(this, Object.assign({}, o, { id: this.nextId++ }));
      // its garden path, where the new map has one and the old world still has grass
      if (o.type !== 'building' || !b.door) continue;
      const dx = o.x + b.door[0];
      for (let y = o.y + b.h; y < MAP_H; y++) {
        const i = tIdx(dx, y);
        if (m.tiles[i] !== T.PATH || this.tiles[i] === T.PATH || !land(this.tiles[i]) || this.occ[i]) break;
        this.tiles[i] = T.PATH; this.grass[i] = 0;
      }
    }
  }

  _setupMap(m) {
    this.wild = m.wild;
    this.riverside = m.riverside;
    this.objs = new Map();
    this.occ = new Int32Array(MAP_W * MAP_H);
    this.byTile = new Map();
  }

  serialize() {
    for (const p of this.players.values()) this._storePlayer(p);
    return {
      v: GAME_VERSION, name: this.name, seed: this.seed, time: this.time, weather: this.weather,
      coins: this.coins, mats: this.mats, journal: this.journal, log: this.log, mail: this.mail, mailSeq: this.mailSeq,
      quest: this.quest, tierSent: this.tierSent, adaDay: this.adaDay, allDone: this.allDone, stats: this.stats,
      tiles: b64encode(this.tiles), grass: b64encode(this.grass), objs: Array.from(this.objs.values()), nextId: this.nextId,
      dug: this._todayDug(), featured: this.featured, visitors: this.visitors, players: this.saved, savedAt: Date.now(),
      side: this.side, found: this.found,
    };
  }

  _todayDug() {
    const today = dayIdx(this.time), out = {};
    for (const k in this.dug) if (this.dug[k] === today) out[k] = today;
    return out;
  }

  // ---------------------------------------------------------------- events
  ev(...e) { if (!this.bulk) this.pendAll.push(e); }
  evTo(pid, ...e) {
    let q = this.pendTo.get(pid);
    if (!q) { q = []; this.pendTo.set(pid, q); }
    q.push(e);
  }
  flush() {
    if (!this.out) { this.pendAll = []; this.pendTo.clear(); return; }
    const all = this.pendAll;
    this.pendAll = [];
    for (const pid of this.players.keys()) {
      const own = this.pendTo.get(pid);
      if (!all.length && !own) continue;
      this.out.send(pid, { t: 'ev', e: own ? all.concat(own) : all });
    }
    this.pendTo.clear();
  }
  toastAll(text, icon) { this.ev('toast', text, icon || ''); }
  toast(p, text, icon) { this.evTo(p.pid, 'toast', text, icon || ''); }
  fail(p, text) { this.evTo(p.pid, 'toast', text, 'no'); this.evTo(p.pid, 'snd', 'error'); }

  addObj(o) {
    if (!o.id) o.id = this.nextId++;
    idxAdd(this, o);
    this.ev('oa', o);
    return o;
  }
  removeObj(o) {
    idxRemove(this, o);
    this.ev('or', o.id);
  }
  touch(o, keys) {
    const patch = {};
    for (const k of keys) patch[k] = o[k];
    this.ev('ou', o.id, patch);
  }
  setTile(x, y, t) {
    const i = tIdx(x, y);
    this.tiles[i] = t;
    this.ev('tile', i, t);
  }
  setGrass(i, h) {
    this.grass[i] = h;
    this.ev('gr', i, h);
  }

  // ---------------------------------------------------------------- players
  join(pid, hello) {
    let token = String(hello.token || makeToken()).slice(0, 40);
    // the same browser in two tabs: give the second tab its own identity
    for (let n = 2; Array.from(this.players.values()).some((q) => q.token === token); n++) token = String(hello.token).slice(0, 36) + '~' + n;
    const rec = this.saved[token];
    const n = this.players.size;
    const p = {
      pid, token,
      name: cleanName(hello.name) || (rec && rec.name) || 'Birder',
      look: cleanLook(hello.look || (rec && rec.look)),
      x: rec && rec.x ? rec.x : HOME_SPAWN[0] + (n % 3 - 1) * 14,
      y: rec && rec.y ? rec.y : HOME_SPAWN[1] + Math.floor(n / 3) * 10,
      d: 0, m: 0, a: '',
      inv: rec && rec.inv ? rec.inv : starterInventory(),
      sleep: false,
    };
    if (feetBlocked(this, p.x, p.y)) { p.x = HOME_SPAWN[0]; p.y = HOME_SPAWN[1]; }
    this.players.set(pid, p);
    this._storePlayer(p);
    this.ev('pj', publicPlayer(p));
    this.out && this.out.send(pid, { t: 'welcome', snap: this.snapshotFor(pid) });
    if (this.players.size > 1) {
      this.toastAll(p.name + ' arrived in the valley!', 'heart');
      this.ev('chat', '', p.name + ' joined.', null);
    }
    this._sleepStatus();
    return p;
  }

  leave(pid) {
    const p = this.players.get(pid);
    if (!p) return;
    this._storePlayer(p);
    this.players.delete(pid);
    this.pauseSet.delete(pid);
    this.ev('pq', pid);
    if (this.players.size) { this.ev('chat', '', p.name + ' left.', null); this.toastAll(p.name + ' went home.', ''); }
    this._sleepStatus();
    this._maybeSleep();
  }

  _storePlayer(p) { this.saved[p.token] = { name: p.name, look: p.look, inv: p.inv, x: p.x, y: p.y }; }

  snapshotFor(pid) {
    const p = this.players.get(pid);
    return {
      name: this.name, seed: this.seed, you: pid,
      tiles: b64encode(this.tiles), grass: b64encode(this.grass), objs: Array.from(this.objs.values()),
      time: this.time, weather: this.weather, coins: this.coins, mats: this.mats, journal: this.journal,
      log: this.log, mail: this.mail, quest: this.quest, visitors: this.visitors, featured: this.featured,
      players: Array.from(this.players.values()).map(publicPlayer),
      animals: this.animals.map(publicAnimal), dug: this._todayDug(),
      inv: p ? p.inv : [], stats: this.stats, allDone: this.allDone, side: this.side, found: this.found,
    };
  }

  // ---------------------------------------------------------------- loop
  isPaused() {
    if (this.players.size !== 1) return false;
    for (const pid of this.players.keys()) return this.pauseSet.has(pid);
    return false;
  }

  tick(dt) {
    if (!this.isPaused() && this.players.size > 0) {
      this.msAcc += dt;
      let guard = 0;
      while (this.msAcc >= MS_PER_MIN && guard++ < 50) {
        this.msAcc -= MS_PER_MIN;
        this.time.min++;
        this._onMinute();
      }
    }
    this._updateAnimals(dt);
    this.posTimer += dt;
    if (this.posTimer >= 100) {
      this.posTimer = 0;
      if (this.out && this.players.size) {
        const pl = [];
        for (const p of this.players.values()) pl.push([p.pid, Math.round(p.x), Math.round(p.y), p.d, p.m, p.a, p.sleep ? 1 : 0]);
        this.out.broadcast({ t: 'pl', p: pl, a: this.animals.map(publicAnimal) });
      }
    }
    this.saveTimer += dt;
    if (this.saveTimer > 60000) { this.saveTimer = 0; if (this.onSave) this.onSave(); }
    this.flush();
  }

  _onMinute() {
    const m = this.time.min;
    if (m % 10 === 0) {
      this.ev('time', this.time, this.weather);
      this.checkArrivals();
    }
    if (m === 11 * 60) {
      for (const o of Array.from(this.objs.values())) if (o.type === 'web') this.removeObj(o);
    }
    if (m >= DAY_END) {
      this.toastAll('It\'s 2 am… everyone stumbles home to bed.', 'moon');
      this.newDay();
    }
  }

  // ---------------------------------------------------------------- animals
  _makeAnimals() {
    const a = [];
    let n = 1;
    const mk = (kind, pen) => {
      const [x0, y0, x1, y1] = ANIMAL_PENS[pen];
      a.push({ id: 'a' + (n++), kind, x: x0 + Math.random() * (x1 - x0), y: y0 + Math.random() * (y1 - y0), d: 0, m: 0, tx: 0, ty: 0, w: 500, pen, br: -1 });
    };
    for (let i = 0; i < 4; i++) mk('sheep', 'sheep');
    mk('horse', 'horse');
    for (let i = 0; i < 5; i++) mk('chicken', 'chicken');
    this.animals = a;
  }

  _updateAnimals(dt) {
    for (const a of this.animals) {
      if (a.w > 0) { a.w -= dt; a.m = 0; continue; }
      const [x0, y0, x1, y1] = ANIMAL_PENS[a.pen];
      if (!a.tx) { a.tx = x0 + Math.random() * (x1 - x0); a.ty = y0 + Math.random() * (y1 - y0); }
      const dx = a.tx - a.x, dy = a.ty - a.y, d = Math.hypot(dx, dy);
      const spd = a.kind === 'horse' ? 22 : a.kind === 'chicken' ? 20 : 12;
      if (d < 2 || Math.random() < 0.0005 * dt) {
        a.tx = 0; a.m = 0;
        a.w = (a.kind === 'chicken' ? 600 : 1500) + Math.random() * 4000;
        continue;
      }
      const step = Math.min(d, spd * dt / 1000);
      const nx = a.x + dx / d * step, ny = a.y + dy / d * step;
      const [mx, my] = moveActor(this, a.x, a.y, nx - a.x, ny - a.y);
      if (Math.abs(mx - a.x) + Math.abs(my - a.y) < step * 0.3) { a.tx = 0; a.w = 800; }
      a.x = clamp(mx, x0 - 8, x1 + 8); a.y = clamp(my, y0 - 8, y1 + 8);
      a.d = Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? 1 : 2) : (dy < 0 ? 3 : 0);
      a.m = 1;
    }
  }

  // ---------------------------------------------------------------- inventory & pouch
  gainMat(p, k, n, src) {
    if (!n) return;
    const before = this.mats[k] || 0;
    this.mats[k] = Math.min(MAT_MAX, before + n);
    this.ev('mats', { [k]: this.mats[k] });
    if (p && src) this.ev('gain', p.pid, src[0], src[1], [['m', k, n]]);
    this.questCheck();
  }
  hasMats(req) { for (const k in req) if ((this.mats[k] || 0) < req[k]) return false; return true; }
  takeMats(req) {
    const ch = {};
    for (const k in req) { this.mats[k] -= req[k]; ch[k] = this.mats[k]; }
    this.ev('mats', ch);
  }
  gainItem(p, k, n, src) {
    let left = n;
    for (const s of p.inv) if (s && s.k === k && s.n < STACK_MAX && left > 0) { const add = Math.min(left, STACK_MAX - s.n); s.n += add; left -= add; }
    for (let i = 0; i < p.inv.length && left > 0; i++) if (!p.inv[i]) { const add = Math.min(left, STACK_MAX); p.inv[i] = { k, n: add }; left -= add; }
    this.evTo(p.pid, 'inv', p.inv);
    const got = n - left;
    if (got && src) this.ev('gain', p.pid, src[0], src[1], [['i', k, got]]);
    if (left > 0) this.fail(p, 'Your bag is full!');
    return got;
  }
  hasRoom(p, k) { return p.inv.some((s) => !s || (s.k === k && s.n < STACK_MAX)); }
  takeSlot(p, slot, n) {
    const s = p.inv[slot];
    if (!s) return false;
    s.n -= n;
    if (s.n <= 0) p.inv[slot] = null;
    this.evTo(p.pid, 'inv', p.inv);
    return true;
  }

  // ---------------------------------------------------------------- messages
  handle(pid, msg) {
    const p = this.players.get(pid);
    if (!p || !msg || typeof msg !== 'object') return;
    try {
      if (msg.t === 'pos') this.onPos(p, msg);
      else if (msg.t === 'act') this.onAct(p, msg);
    } catch (err) {
      console.error('World.handle error', err, msg);
    }
    this.flush();
  }

  onPos(p, m) {
    const x = +m.x, y = +m.y;
    if (!isFinite(x) || !isFinite(y)) return;
    if (p.sleep) return;
    if (dist2(x, y, p.x, p.y) > 160 * 160) { this.evTo(p.pid, 'tp', p.x, p.y); return; }
    p.x = clamp(x, 4, MAP_W * TS - 4);
    p.y = clamp(y, 4, MAP_H * TS - 4);
    p.d = (m.d | 0) & 3;
    p.m = m.m ? 1 : 0;
    p.a = typeof m.a === 'string' ? m.a.slice(0, 8) : '';
  }

  reachObj(p, o, extra) {
    const [w, h] = footprint(o);
    const x0 = o.x * TS, y0 = o.y * TS, x1 = x0 + w * TS, y1 = y0 + h * TS;
    const cx = clamp(p.x, x0, x1), cy = clamp(p.y, y0, y1);
    const r = 44 + (extra || 0);
    return dist2(p.x, p.y, cx, cy) <= r * r;
  }
  reachTile(p, x, y) { return dist2(p.x, p.y, x * TS + 8, y * TS + 8) <= 48 * 48; }

  onAct(p, m) {
    switch (m.a) {
      case 'use': return this.actUse(p, m);
      case 'tile': return this.actTile(p, m);
      case 'place': return this.actPlace(p, m);
      case 'nest': return this.actNest(p, m);
      case 'line': return this.actLine(p, m);
      case 'nclear': return this.actNestClear(p, m);
      case 'pickup': return this.actPickup(p, m);
      case 'craft': return this.actCraft(p, m);
      case 'buy': return this.actBuy(p, m);
      case 'sell': return this.actSell(p, m);
      case 'obs': return this.actObserve(p, m);
      case 'talk': return this.actTalk(p, m);
      case 'opt': return this.actOpt(p, m);
      case 'mail': return this.actMail(p, m);
      case 'swap': return this.actSwap(p, m);
      case 'trash': return this.actTrash(p, m);
      case 'sleep': return this.actSleep(p, m);
      case 'chat': return this.actChat(p, m);
      case 'look': return this.actLook(p, m);
      case 'pause': if (m.v) this.pauseSet.add(p.pid); else this.pauseSet.delete(p.pid); return;
      case 'brush': return this.actBrush(p, m);
    }
  }

  actUse(p, m) {
    const o = this.objs.get(m.id | 0);
    if (!o || !this.reachObj(p, o)) return;
    const q = quickOp(this, o);
    if (!q || q.op !== m.op) return;
    const today = dayIdx(this.time);
    const src = [o.x * TS + 8, o.y * TS + 8];
    switch (q.op) {
      case 'shake': {
        if (o.type === 'tree') {
          if (o.kind === 'apple' && o.fr > 0) { this.gainItem(p, 'apple', o.fr, src); o.fr = 0; }
          if (o.sh !== today) {
            o.sh = today;
            this.gainMat(p, 'twig', o.st >= 2 ? 1 + (Math.random() < 0.5 ? 1 : 0) + (o.kind === 'oak' ? 1 : 0) : 1, src);
            if (o.kind === 'willow' && this.time.season === SPRING && o.st >= 2) this.gainMat(p, 'fluff', 2, src);
            if (Math.random() < 0.12) { this.gainMat(p, 'feather', 1, src); this.toast(p, 'A feather drifted down from the branches!', 'feather'); }
          }
          this.touch(o, ['fr', 'sh']);
        } else {
          o.sh = today;
          this.gainMat(p, 'twig', 1, src);
          this.touch(o, ['sh']);
        }
        this.ev('fx', 'shake', o.id, 0, 0);
        break;
      }
      case 'pick': {
        const f = FLORA[o.kind].fruit;
        const got = this.gainItem(p, f.item, o.fr, src);
        o.fr -= got;
        this.touch(o, ['fr']);
        this.ev('fx', 'shake', o.id, 0, 0);
        break;
      }
      case 'harvest': {
        const h = harvestInfo(this, o);
        o.hv = today;
        this.gainMat(p, h.mat, h.n, src);
        this.touch(o, ['hv']);
        this.ev('fx', 'rustle', o.id, 0, 0);
        break;
      }
      case 'moss': o.moss--; this.gainMat(p, 'moss', 1, src); this.touch(o, ['moss']); this.ev('fx', 'scrape', o.id, 0, 0); break;
      case 'look': {
        const l = LANDMARKS[o.kind];
        const first = !this.found[o.kind];
        if (first) {
          this.found[o.kind] = today;
          this.coins += LANDMARK_REWARD; this.ev('coins', this.coins);
          this.ev('found', this.found);
          this.toastAll((p.name ? p.name + ' discovered ' : 'Discovered ') + 'the ' + l.name + '! (+' + LANDMARK_REWARD + ' coins)', 'star');
        }
        this.evTo(p.pid, 'lore', o.kind, first);
        break;
      }
      case 'bark': o.bk = today; this.gainMat(p, 'bark', 2, src); this.touch(o, ['bk']); this.ev('fx', 'scrape', o.id, 0, 0); break;
      case 'lichen': o.li--; this.gainMat(p, 'lichen', 1, src); this.touch(o, ['li']); this.ev('fx', 'scrape', o.id, 0, 0); break;
      case 'rot': o.rv = today; this.gainMat(p, 'rotwood', 1, src); this.touch(o, ['rv']); this.ev('fx', 'crumble', o.id, 0, 0); break;
      case 'collect': {
        if (o.type === 'web') { this.removeObj(o); this.gainMat(p, 'silk', 1, src); this.ev('fx', 'silk', 0, src[0], src[1]); break; }
        if (o.type === 'qitem') {
          this.removeObj(o);
          const q = QUESTS_BY_ID[o.q], st = this.side[o.q];
          this.ev('fx', 'pickup', 0, src[0], src[1]);
          if (!q || !st || st.st !== 'on') break;
          st.n = (st.n || 0) + 1;
          this.ev('side', this.side);
          this.toastAll(q.n > 1 ? 'Found ' + QITEMS[q.item].name + ' (' + Math.min(st.n, q.n) + '/' + q.n + ')' + (st.n >= q.n ? ' — back to ' + NPCS[q.npc].name + '!' : '')
            : 'Found ' + QITEMS[q.item].name + '! Take it back to ' + NPCS[q.npc].name + '.', 'star');
          break;
        }
        if (o.type === 'puddle') {
          o.q--;
          this.gainMat(p, 'mud', 1, src);
          if (o.q <= 0) this.removeObj(o); else this.touch(o, ['q']);
          this.ev('fx', 'mud', 0, src[0], src[1]);
          break;
        }
        this.removeObj(o);
        switch (o.kind) {
          case 'twig': this.gainMat(p, 'twig', o.q || 1, src); break;
          case 'stick': this.gainMat(p, 'stick', 1, src); break;
          case 'leaves': this.gainMat(p, 'leaves', 2, src); break;
          case 'feather': this.gainMat(p, 'feather', 1, src); break;
          case 'stone': this.gainMat(p, 'stone', 1, src); break;
          case 'driftwood': this.gainMat(p, 'wood', 2, src); break;
          case 'mushroom': this.gainItem(p, 'mushroom', 1, src); break;
          case 'garlic': this.gainItem(p, 'garlic', 1, src); break;
          case 'note': this.giveHint(o.sp, 'note', p); break;
        }
        this.ev('fx', 'pickup', 0, src[0], src[1]);
        break;
      }
    }
  }

  actBrush(p, m) {
    const a = this.animals.find((x) => x.id === m.id);
    if (!a || dist2(p.x, p.y, a.x, a.y) > 40 * 40) return;
    const today = dayIdx(this.time);
    if (a.br === today) { this.toast(p, a.kind === 'chicken' ? 'The hen has had enough fuss for today.' : 'Already brushed today — come back tomorrow!', ''); return; }
    a.br = today;
    const src = [a.x, a.y - 8];
    if (a.kind === 'sheep') { this.gainMat(p, 'wool', 1, src); this.ev('fx', 'hearts', 0, a.x, a.y - 14); }
    else if (a.kind === 'horse') { this.gainMat(p, 'hair', 1, src); this.ev('fx', 'hearts', 0, a.x, a.y - 22); }
    else { this.gainMat(p, 'feather', 1, src); this.ev('fx', 'hearts', 0, a.x, a.y - 8); this.toast(p, 'The hen fluffs up and drops a feather. Cluck!', 'feather'); }
    this.ev('snd', 'brush', a.x, a.y);
  }

  actTile(p, m) {
    const x = m.x | 0, y = m.y | 0;
    if (!inBounds(x, y) || !this.reachTile(p, x, y)) return;
    const q = tileOp(this, x, y);
    if (!q || q.op !== m.op) return;
    const i = tIdx(x, y), today = dayIdx(this.time);
    const src = [x * TS + 8, y * TS + 8];
    switch (q.op) {
      case 'cut': this.setGrass(i, 0); this.gainMat(p, 'grass', 1, src); this.ev('fx', 'grass', 0, src[0], src[1]); break;
      case 'mud': this.dug[i] = today; this.ev('dug', i, today); this.gainMat(p, 'mud', 1, src); this.ev('fx', 'mud', 0, src[0], src[1]); break;
      case 'sand': this.dug[i] = today; this.ev('dug', i, today); this.gainMat(p, 'sand', 1, src); this.ev('fx', 'dig', 0, src[0], src[1]); break;
      case 'clay': this.dug[i] = today; this.ev('dug', i, today); this.gainMat(p, 'clay', 1, src); this.ev('fx', 'dig', 0, src[0], src[1]); break;
      case 'gravel': this.dug[i] = today; this.ev('dug', i, today); this.gainMat(p, 'stone', 1, src); this.ev('fx', 'dig', 0, src[0], src[1]); break;
    }
  }

  actPlace(p, m) {
    const slot = m.slot | 0, x = m.x | 0, y = m.y | 0;
    const s = p.inv[slot];
    if (!s || !this.reachTile(p, x, y)) return;
    const chk = canPlace(this, s.k, x, y, Array.from(this.players.values()));
    if (!chk.ok) { if (chk.reason) this.fail(p, chk.reason); return; }
    const it = ITEMS[s.k];
    const today = dayIdx(this.time);
    if (it.cat === 'struct') {
      if (it.struct === 'pondpatch') {
        const i = tIdx(x, y);
        this.setTile(x, y, T.SHALLOW);
        this.setGrass(i, 0);
        this.ev('fx', 'splash', 0, x * TS + 8, y * TS + 8);
        this.toast(p, 'A new pond tile! Plant reeds and cattails in it.', 'water');
      } else if (it.struct === 'snag') {
        this.addObj({ type: 'tree', kind: 'snag', x, y, st: 2, pl: 1, by: p.name });
        this.ev('fx', 'place', 0, x * TS + 8, y * TS + 12);
      } else {
        this.addObj({ type: 'struct', kind: it.struct, x, y, pl: 1, by: p.name });
        this.ev('fx', 'place', 0, x * TS + 8, y * TS + 12);
      }
    } else {
      const f = FLORA[it.plant];
      const o = { type: f.type, kind: it.plant, x, y, st: 0, g: 0, pl: 1, by: p.name, d: today };
      if (f.type === 'shrub') o.fr = 0;
      if (f.type === 'plant') o.hv = -1;
      if (this.grass[tIdx(x, y)]) this.setGrass(tIdx(x, y), 0);
      this.addObj(o);
      this.ev('fx', 'plant', 0, x * TS + 8, y * TS + 12);
      for (const q of QUESTS) {
        const st = this.side[q.id];
        if (q.kind === 'plant' && q.plant === it.plant && st && st.st === 'on' && (st.n || 0) < q.n) {
          st.n = (st.n || 0) + 1; this.ev('side', this.side);
          this.toast(p, q.title + ': ' + st.n + '/' + q.n + (st.n >= q.n ? ' — tell ' + NPCS[q.npc].name + '!' : ''), 'star');
        }
      }
    }
    this.takeSlot(p, slot, 1);
  }

  actNest(p, m) {
    const sp = SPECIES_BY_ID[m.sp];
    if (!sp || sp.site === 'parasite') return;
    if (!knownSpecies(this, sp.id)) return this.fail(p, 'You haven\'t learned this nest yet — find more clues!');
    let host = null, cx, cy, slot = 0;
    if (m.host) {
      host = this.objs.get(m.host | 0);
      if (!host || !this.reachObj(p, host, 8)) return;
      if (!sitesOf(this, host).includes(sp.site)) return this.fail(p, 'This spot doesn\'t suit a ' + sp.name + '.');
      const existing = nestsOfHost(this, host.id);
      if (existing.length >= hostSlots(host)) return this.fail(p, 'There\'s no room for another nest here.');
      const used = existing.map((n) => n.slot);
      while (used.includes(slot)) slot++;
      [cx, cy] = hostCenter(host);
    } else {
      cx = m.x | 0; cy = m.y | 0;
      if (!inBounds(cx, cy) || !this.reachTile(p, cx, cy)) return;
      if (!sitesOf(this, { tile: [cx, cy] }).includes(sp.site)) return this.fail(p, 'This spot doesn\'t suit a ' + sp.name + '.');
    }
    if (!this.hasMats(sp.mats)) return this.fail(p, 'Not enough nest materials.');
    this.takeMats(sp.mats);
    const n = {
      type: 'nest', kind: sp.id, x: host ? host.x : cx, y: host ? host.y : cy, host: host ? host.id : 0, slot,
      st: sp.id === 'wren' ? 'cock' : 'built', t: 0, eggs: 0, ch: 0, cl: 0, arr: 0, by: p.name, d: dayIdx(this.time),
    };
    if (!host && (this.tiles[tIdx(cx, cy)] === T.GRASS || this.tiles[tIdx(cx, cy)] === T.MARSH)) this.setGrass(tIdx(cx, cy), 2);
    this.addObj(n);
    this.stats.built++;
    this.toastAll(p.name + ' built a ' + sp.name + (sp.id === 'wren' ? ' cock nest!' : ' nest!'), 'nest');
    this.ev('fx', 'build', n.id, cx * TS + 8, cy * TS + 8);
    if (sp.id === 'wren') this.toast(p, 'Wren males build several cock nests. Build another one nearby!', 'nest');
    this.questCheck();
    this.checkArrivals();
  }

  actLine(p, m) {
    const n = this.objs.get(m.id | 0);
    if (!n || n.type !== 'nest' || n.st !== 'lining') return;
    const sp = SPECIES_BY_ID[n.kind];
    if (!sp.lining) return;
    if (!this.hasMats(sp.lining)) return this.fail(p, 'Not enough feathers for the lining.');
    this.takeMats(sp.lining);
    n.st = 'pair';
    n.cl = randInt(Math.random, sp.clutch[0], sp.clutch[1]);
    this.touch(n, ['st', 'cl']);
    this.toastAll('The Wren nest is lined with feathers — the pair has moved in!', 'heart');
    this.ev('fx', 'hearts', n.id, 0, 0);
  }

  actNestClear(p, m) {
    const n = this.objs.get(m.id | 0);
    if (!n || n.type !== 'nest') return;
    const host = n.host ? this.objs.get(n.host) : null;
    if (host ? !this.reachObj(p, host, 8) : !this.reachTile(p, n.x, n.y)) return;
    const sp = SPECIES_BY_ID[n.kind];
    if (n.st === 'old') {
      this.removeObj(n);
      this.toastAll('Old nest cleaned out. This gets rid of fleas and mites before the next brood.', 'nest');
      if (Math.random() < 0.5) this.gainMat(p, 'feather', 1, [n.x * TS + 8, n.y * TS + 8]);
    } else if (n.st === 'built' || n.st === 'cock' || n.st === 'lining') {
      this.removeObj(n);
      const refund = {};
      for (const k in sp.mats) refund[k] = Math.floor(sp.mats[k] / 2);
      for (const k in refund) if (refund[k]) this.gainMat(p, k, refund[k]);
      this.toast(p, 'Nest removed. Some materials were saved.', 'nest');
    } else {
      this.fail(p, 'Never disturb an active nest!');
    }
  }

  actPickup(p, m) {
    const o = this.objs.get(m.id | 0);
    if (!o || !o.pl || !this.reachObj(p, o)) return;
    const nests = nestsOfHost(this, o.id);
    if (nests.some((n) => n.st !== 'old' && n.st !== 'built')) return this.fail(p, 'Birds are using it — leave it be!');
    let key = null;
    if (o.type === 'struct') key = o.kind;
    else key = PLANT_ITEM[o.kind];
    if (!key || !ITEMS[key]) return;
    if (!this.hasRoom(p, key)) return this.fail(p, 'Your bag is full!');
    for (const n of nests) this.removeObj(n);
    this.removeObj(o);
    this.gainItem(p, key, 1, [o.x * TS + 8, o.y * TS + 8]);
  }

  actCraft(p, m) {
    const r = RECIPES.find((x) => x.id === m.r);
    if (!r) return;
    if (!this.hasMats(r.mats)) return this.fail(p, 'Not enough materials.');
    if (!this.hasRoom(p, r.id)) return this.fail(p, 'Your bag is full!');
    this.takeMats(r.mats);
    this.gainItem(p, r.id, 1);
    this.evTo(p.pid, 'snd', 'craft');
    this.toast(p, 'Crafted: ' + ITEMS[r.id].name + '! Face an empty spot and press E to place it.', 'hammer');
    if (TUTORIAL[this.quest] && TUTORIAL[this.quest].id === 'craft') this._advanceQuest();
  }

  clockMin() { return this.time.min + this.msAcc / MS_PER_MIN; }
  _nearNpc(p, id) {
    if (!NPCS[id]) return false;
    const n = npcPos(id, this.clockMin());
    return !n.away && dist2(p.x, p.y, n.x * TS, n.y * TS) <= 80 * 80;
  }

  actBuy(p, m) {
    const k = String(m.k), n = clamp(m.n | 0, 1, 20);
    if (!SHOP_STOCK.includes(k) || !this._nearNpc(p, 'basil')) return;
    if (k === 'mat:wood') {
      const cost = WOOD_PRICE * n;
      if (this.coins < cost) return this.fail(p, 'Not enough coins.');
      this.coins -= cost; this.ev('coins', this.coins);
      this.gainMat(p, 'wood', n);
      this.evTo(p.pid, 'snd', 'coin');
      return;
    }
    const it = ITEMS[k];
    const cost = it.price * n;
    if (this.coins < cost) return this.fail(p, 'Not enough coins.');
    if (!this.hasRoom(p, k)) return this.fail(p, 'Your bag is full!');
    this.coins -= cost; this.ev('coins', this.coins);
    const got = this.gainItem(p, k, n);
    if (got < n) { this.coins += it.price * (n - got); this.ev('coins', this.coins); }
    this.evTo(p.pid, 'snd', 'coin');
  }

  actSell(p, m) {
    const slot = m.slot | 0;
    const s = p.inv[slot];
    if (!s || !this._nearNpc(p, 'basil')) return;
    const n = clamp(m.n | 0, 1, s.n);
    const price = itemSellPrice(s.k) * n;
    this.takeSlot(p, slot, n);
    this.coins += price; this.ev('coins', this.coins);
    this.evTo(p.pid, 'snd', 'coin');
  }

  actObserve(p, m) {
    const sp = SPECIES_BY_ID[m.sp];
    if (!sp || !this.visitors.some((v) => v.sp === sp.id)) return;
    const j = this.journal[sp.id];
    if (!j.seen) { j.seen = true; this.ev('jr', sp.id, j); }
    for (const q of QUESTS) {
      const st = this.side[q.id];
      if (q.kind !== 'observe' || !st || st.st !== 'on' || (q.night && !sp.night)) continue;
      st.seen = st.seen || [];
      if (!st.seen.includes(sp.id) && st.seen.length < q.n) {
        st.seen.push(sp.id); this.ev('side', this.side);
        this.toast(p, q.title + ': ' + st.seen.length + '/' + q.n + ' species' + (st.seen.length >= q.n ? ' — tell ' + NPCS[q.npc].name + '!' : ''), 'star');
      }
    }
    if (this.featured.includes(sp.id) && j.h < 3 && !this.observed[sp.id]) {
      this.observed[sp.id] = 1;
      this.giveHint(sp.id, 'obs', p);
    } else if (j.h > 0) {
      this.evTo(p.pid, 'fact', sp.id, sp.facts[Math.floor(Math.random() * sp.facts.length)]);
    } else {
      this.toast(p, 'It flew off before you got a good look. Try again tomorrow!', '');
    }
  }

  giveHint(spId, src, p) {
    const j = this.journal[spId];
    if (!j || j.h >= 3) {
      if (p) this.evTo(p.pid, 'fact', spId, SPECIES_BY_ID[spId].facts[Math.floor(Math.random() * 4)]);
      return false;
    }
    const i = j.h;
    j.h++;
    if (src === 'obs') j.seen = true;
    this.log.push({ sp: spId, i, d: dateStr(this.time), src, by: p ? p.name : '' });
    this.ev('jr', spId, j);
    this.ev('clue', spId, i, src, p ? p.pid : '', p ? p.name : '');
    if (j.h === 3) this.toastAll('Nest blueprint learned: ' + SPECIES_BY_ID[spId].name + '!', 'star');
    this.questCheck();
    return true;
  }

  dlg(p, npc, lines, opts) { this.evTo(p.pid, 'dlg', { npc, lines, opts }); }

  actTalk(p, m) {
    const id = String(m.npc);
    if (!NPCS[id] || !this._nearNpc(p, id)) return;
    const step = TUTORIAL[this.quest] ? TUTORIAL[this.quest].id : '';
    const nq = npcQuest(this, id);
    const questOpt = nq ? [{ id: 'q', label: nq.state === 'offer' ? 'Need a hand?' : 'About ' + nq.q.title + '…' }] : [];
    if (id === 'ada') {
      if (step === 'mail' || step === 'ada') {
        for (let k = 0; k < 3; k++) this.giveHint('blackbird', 'ada', null);
        this.quest = TUTORIAL.findIndex((s) => s.id === 'gather');
        this.ev('quest', this.quest);
        this._advanceQuest(true);
        return this.dlg(p, 'ada', [
          'Ah, you must be my new neighbour! Welcome to Featherbrook.',
          'Let\'s start with a familiar friend: the Eurasian Blackbird. I\'ve written its nest blueprint into your journal.',
          'Blackbirds build a cup of twigs and dry grass, plastered inside with mud. Shake trees for twigs, cut long grass in the meadows, and scoop mud from the muddy shore of your garden pond.',
          'Then find a shrub next to your lawn and press F (or right-click) on it to build the nest. The birds will do the rest!',
          'Press TAB any time to open your journal.',
        ], [{ id: 'bye', label: 'Thanks, Ada!' }]);
      }
      const tips = {
        gather: 'Twigs from shaking trees, dry grass from long grass, and mud from the muddy pond shore by your cottage.',
        build: 'Find a shrub next to your lawn and press F to build the Blackbird nest.',
        arrive: 'Now we wait. Blackbirds move in quickly when a spot is right.',
        sleep: 'A pair moved in? Wonderful! Get some rest — birds lay their eggs in the early morning.',
        craft: 'Nest boxes next! Robins like an open-fronted box; Great Tits a box with a 28 mm hole. Your workbench is beside the cottage, and you have some wood.',
        clues: 'Watch the birds you don\'t know yet: get close, stand still and press E to observe them. Field Notes with clues are scattered around too.',
      };
      const n = nestedCount(this);
      const line = tips[step] || (n >= SPECIES.length ? 'Listen to that chorus! You did it, neighbour.' :
        pick(['Hello, neighbour! The valley sounds livelier every day.', 'Good to see you! Any new birds?', 'Ah, there you are. I was just updating the survey.']));
      return this.dlg(p, 'ada', [line], questOpt.concat([
        { id: 'lead', label: 'Any leads?' }, { id: 'fact', label: 'Bird fact' },
        { id: 'progress', label: 'How are we doing?' }, { id: 'bye', label: 'Bye' }]));
    }
    if (id === 'basil') return this.dlg(p, 'basil', [pick(NPC_LINES.basil)], questOpt.concat([{ id: 'shop', label: 'Let\'s shop!' }, { id: 'bye', label: 'Bye' }]));
    if (nq) return this._questDialog(p, id, nq);
    return this.dlg(p, id, [pick(NPC_LINES[id])], [{ id: 'bye', label: 'Bye' }]);
  }

  _questDialog(p, npc, nq) {
    const q = nq.q;
    if (nq.state === 'offer') return this.dlg(p, npc, q.ask, [{ id: 'qa', label: 'I\'ll help!' }, { id: 'bye', label: 'Not now' }]);
    if (nq.state === 'active') {
      const prog = q.n > 1 ? ' (' + questProgress(this, q) + '/' + q.n + ')' : '';
      return this.dlg(p, npc, ['Any luck? ' + q.hint + prog], [{ id: 'bye', label: 'I\'m on it!' }]);
    }
    const give = q.kind === 'bring' ? 'Hand over ' + q.n + ' ' + MATS[q.mat].name.toLowerCase() : q.kind === 'find' ? 'Here you go!' : 'All done!';
    return this.dlg(p, npc, [q.kind === 'find' ? 'Oh! Did you find it?' : 'How did it go?'], [{ id: 'qc', label: give }, { id: 'bye', label: 'Later' }]);
  }

  acceptQuest(p, q) {
    if (this.side[q.id]) return;
    this.side[q.id] = { st: 'on', n: 0, seen: [], d: dayIdx(this.time) };
    if (q.kind === 'find') this._spawnQuestItems(q);
    this.ev('side', this.side);
    this.toastAll('New quest: ' + q.title + ' (' + NPCS[q.npc].name + ')', 'star');
    this.ev('snd', 'clue');
  }

  _spawnQuestItems(q) {
    const left = q.n - (this.side[q.id].n || 0);
    for (let k = 0; k < left; k++) {
      const test = q.shore ? (x, y, t) => t !== T.PATH && nearWater(this, x, y, 1) : (x, y, t) => t !== T.PATH;
      const xy = this._randIn(q.area, test, 400) || this._randIn(q.area, null, 400);
      if (xy) this.addObj({ type: 'qitem', kind: q.item, q: q.id, x: xy[0], y: xy[1] });
    }
  }

  completeQuest(p, q) {
    const st = this.side[q.id];
    if (!st || st.st !== 'on' || !questReady(this, q)) return;
    if (q.kind === 'bring') { if (!this.hasMats({ [q.mat]: q.n })) return; this.takeMats({ [q.mat]: q.n }); }
    st.st = 'done';
    this.ev('side', this.side);
